                            <div>
                                <label className="text-xs font-bold text-[#45464d] uppercase tracking-widest mb-2 block">Correo electrónico</label>
                                <div className="relative">
                                    <span className="material-symbols-outlined absolute left-3.5 top-3.5 text-[#76777d] text-[20px]">mail</span>
                                    <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                                        placeholder="ejemplo@correo.com" required
                                        className="w-full py-3 pl-11 pr-4 border-2 border-[#c6c6cd] rounded-xl bg-white outline-none focus:border-[#006c49] text-[#0b1c30] font-medium text-sm transition-all"
                                    />
                                </div>
                            </div>
                            {/* Password */}
                            <div>
                                <label className="text-xs font-bold text-[#45464d] uppercase tracking-widest mb-2 block">Contraseña</label>
                                <div className="relative">
                                    <span className="material-symbols-outlined absolute left-3.5 top-3.5 text-[#76777d] text-[20px]">lock</span>
                                    <input type={showPassword ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)}
                                        placeholder="••••••••" required
                                        className="w-full py-3 pl-11 pr-12 border-2 border-[#c6c6cd] rounded-xl bg-white outline-none focus:border-[#006c49] text-[#0b1c30] font-medium text-sm transition-all"
                                    />
                                    <button type="button" onClick={() => setShowPassword(p => !p)}
                                        className="absolute right-3.5 top-3.5 text-[#76777d] hover:text-[#006c49] transition-all">
                                        <span className="material-symbols-outlined text-[20px]">{showPassword ? 'visibility_off' : 'visibility'}</span>
                                    </button>
                                </div>
                            </div>
                            {/* Remember + forgot */}
                            <div className="flex items-center justify-between">
                                <label className="flex items-center gap-2 cursor-pointer select-none">
                                    <input type="checkbox" checked={rememberSession} onChange={e => setRememberSession(e.target.checked)}
                                        className="w-4 h-4 accent-[#006c49] rounded" />
                                    <span className="text-sm text-[#45464d] font-medium">Recordar sesión</span>
                                </label>
                                <button type="button"
                                    onClick={async () => {
                                        if (!email) { showToast('Escribe tu correo para recuperar la contraseña.', 'error'); return; }
                                        try {
                                            if (hasValidApiKey && auth) {
                                                const { sendPasswordResetEmail } = window.firebaseAuth || {};
                                                if (sendPasswordResetEmail) { await sendPasswordResetEmail(auth, email); showToast('Correo de recuperación enviado.'); }
                                                else { showToast('Función no disponible.', 'error'); }
                                            } else { showToast('Requiere Firebase configurado.', 'error'); }
                                        } catch(e) { showToast('Error: ' + e.message, 'error'); }
                                    }}
                                    className="text-sm text-[#006c49] font-semibold hover:underline">
                                    ¿Olvidaste tu contraseña?
                                </button>
                            </div>
                            {/* Submit */}
                            <button type="submit"
                                className="w-full py-4 bg-[#131b2e] hover:bg-[#1e2d45] text-white font-extrabold rounded-2xl text-base transition-all shadow-lg active:scale-[0.98]">
                                {isRegistering ? 'Crear Cuenta' : 'Iniciar Sesión'}
                            </button>
                            {/* Divider */}
                            <div className="flex items-center gap-3">
                                <div className="flex-1 h-px bg-[#e0e4f4]" />
                                <span className="text-xs text-[#76777d] font-medium">o</span>
                                <div className="flex-1 h-px bg-[#e0e4f4]" />
                            </div>
                            {/* Google */}
                            <button type="button" onClick={() => showToast('Configura Google Auth en Firebase Console → Authentication.', 'error')}
                                className="w-full py-3.5 flex items-center justify-center gap-3 bg-white border-2 border-[#c6c6cd] rounded-2xl text-sm font-bold text-[#0b1c30] hover:bg-[#f8f9ff] hover:border-[#006c49] transition-all shadow-sm">
                                <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.5 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A24 24 0 0 0 0 24c0 3.9.9 7.5 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.2-8.4 2.2-6.2 0-11.5-4.2-13.5-9.9l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>
                                Continuar con Google
                            </button>
                            {/* Register link */}
                            <p className="text-center text-sm text-[#45464d]">
                                {isRegistering ? '¿Ya tienes una cuenta? ' : '¿No tienes cuenta? '}
                                <button type="button" onClick={() => setIsRegistering(p => !p)}
                                    className="text-[#006c49] font-bold hover:underline">
                                    {isRegistering ? 'Inicia sesión aquí' : 'Regístrate gratis aquí'}
                                </button>
                            </p>
                        </form>
                    );

                    return (
                        <div className="min-h-screen bg-gradient-to-br from-[#e8f5f0] via-[#f0f7ff] to-[#dce9ff] flex flex-col">

                            {/* ════ DESKTOP (md+): split layout ════ */}
                            <div className="hidden md:flex flex-1 min-h-screen">

                                {/* Left hero panel */}
                                <div className="w-1/2 bg-gradient-to-br from-[#e6fef4] via-[#f0f7ff] to-[#dce9ff] flex flex-col items-center justify-center p-12 relative overflow-hidden">
                                    {/* Background circles */}
                                    <div className="absolute -top-20 -left-20 w-80 h-80 rounded-full bg-[#006c49]/5" />
                                    <div className="absolute -bottom-16 -right-16 w-64 h-64 rounded-full bg-[#131b2e]/5" />

                                    <div className="relative z-10 text-center max-w-md">

                                            <path d="M30 70 C50 50 55 25 40 10 C35 40 30 55 30 70Z" fill="#4edea3"/>
                                            <path d="M30 60 C15 45 8 25 18 12 C24 38 28 50 30 60Z" fill="#006c49" opacity=".7"/>
                                            <ellipse cx="72" cy="118" rx="22" ry="6" fill="#f0fdf4"/>

                    return (
                        <div className="min-h-screen bg-[#f8f9ff] flex flex-col justify-center items-center">
                            <div className="w-12 h-12 rounded-2xl bg-[#131b2e] flex items-center justify-center mb-4 animate-pulse"></div>
                            <p className="text-[#45464d] text-sm font-medium">Validando sesión...</p>
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen bg-[#f8f9ff] font-sans pb-24 md:pb-0 md:pl-64 text-[#0b1c30] overflow-x-hidden">
                        
                        {/* HUD de Alerta Toast */}
                        {toast && (
                            <div className={`fixed top-4 right-4 z-50 px-5 py-3.5 rounded-2xl shadow-xl flex items-center gap-3 transition-all animate-fade-in border ${toast.type === 'error' ? 'bg-[#ffdad6] border-[#ba1a1a] text-[#ba1a1a]' : 'bg-[#e6fef4] border-[#006c49] text-[#006c49]'}`}>

                            </div>

                                                <div className="flex p-1 bg-[#f0f3ff] rounded-xl text-xs font-bold">
                                                    <button onClick={() => { setCatViewType('Gasto'); setEditingCat(null); }}
                                                        className={`px-4 py-1.5 rounded-lg transition-all ${catViewType === 'Gasto' ? 'bg-white text-rose-600 shadow' : 'text-[#45464d]'}`}>
                                                        Gastos ({presetCategories.Gasto.length + customCategories.Gasto.length})
                                                    </button>
                                                    <button onClick={() => { setCatViewType('Ingreso'); setEditingCat(null); }}
                                                        className={`px-4 py-1.5 rounded-lg transition-all ${catViewType === 'Ingreso' ? 'bg-white text-[#006c49] shadow' : 'text-[#45464d]'}`}>
                                                        Ingresos ({presetCategories.Ingreso.length + customCategories.Ingreso.length})
                                                    </button>
                                                </div>
                                                <button onClick={handleRestoreDefaults} title="Restaurar preestablecidas"
                                                    className="p-2 rounded-xl bg-amber-50 text-amber-600 hover:bg-amber-100 transition-all" >
                                                    <AppIcon name="rotate-ccw" size={16} />
                                                </button>
                                            </div>
                                        </div>

                                        <div className="divide-y divide-slate-100">

                                            {/* ── Sección Preestablecidas ── */}
                                            <div className="px-5 py-2.5 bg-[#f8f9ff] flex justify-between items-center">
                                                <span className="text-[10px] font-black text-[#76777d] uppercase tracking-wider flex items-center gap-1.5">
                                                    <AppIcon name="settings" size={12} /> Preestablecidas del sistema
                                                    <span className="bg-[#e5eeff] text-[#45464d] px-1.5 py-0.5 rounded-full ml-1">{presetCategories[catViewType].length}</span>
                                                </span>
                                                <span className="text-[9px] text-[#76777d] font-medium">Editables y eliminables</span>
                                            </div>

                                            {presetCategories[catViewType].length === 0 && (
                                                <div className="px-5 py-6 text-center">
                                                    <p className="text-xs text-[#76777d] italic">No hay categorías preestablecidas de {catViewType === 'Gasto' ? 'Gastos' : 'Ingresos'}.</p>
                                                    <button onClick={handleRestoreDefaults}
                                                        className="mt-2 text-xs text-amber-600 font-bold hover:underline">
                                                        Restaurar categorías originales →
                                                    </button>
                                                </div>
                                            )}

                                            {presetCategories[catViewType].map((cat, idx) => {
                                                const isEditing = editingCat && editingCat.oldName === cat && editingCat.isPreset && editingCat.type === catViewType;
                                                return (
                                                    <div key={cat + idx}
                                                        className={`px-5 py-3 flex items-center gap-3 group transition-colors ${isEditing ? 'bg-[#f0fdf4]/40' : 'hover:bg-[#f8f9ff]'}`}>
                                                        <span className={`w-2 h-2 rounded-full shrink-0 ${catViewType === 'Gasto' ? 'bg-rose-400' : 'bg-teal-400'}`} />

                                                        {isEditing ? (
                                                            <>
                                                                <input
                                                                    autoFocus
                                                                    type="text"
                                                                    value={editingCat.newName}
                                                                    onChange={e => setEditingCat(prev => ({ ...prev, newName: e.target.value }))}
                                                                    onKeyDown={e => { if (e.key === 'Enter') handleEditSave(); if (e.key === 'Escape') setEditingCat(null); }}
                                                                    className="flex-1 px-3 py-1.5 border-2 border-[#4edea3] rounded-lg text-sm font-semibold text-[#0b1c30] bg-white outline-none"
                                                                />
                                                                <button onClick={handleEditSave}
                                                                    className="p-1.5 bg-[#006c49] text-white rounded-lg hover:bg-[#006c49] shrink-0" title="Guardar (Enter)">
                                                                    <AppIcon name="check" size={14} />
                                                                </button>
                                                                <button onClick={() => setEditingCat(null)}
                                                                    className="p-1.5 bg-[#e5eeff] text-[#45464d] rounded-lg hover:bg-slate-300 shrink-0" title="Cancelar (Esc)">
                                                                    <AppIcon name="x" size={14} />
                                                                </button>
                                                            </>
                                                        ) : (
                                                            <>
                                                                <span className="flex-1 font-semibold text-[#0b1c30] text-sm">{cat}</span>
                                                                <span className="text-[9px] bg-[#f0f3ff] text-[#76777d] px-2 py-0.5 rounded-full font-bold uppercase hidden sm:inline">Sistema</span>
                                                                <button
                                                                    onClick={() => setEditingCat({ type: catViewType, oldName: cat, newName: cat, isPreset: true })}
                                                                    className="opacity-0 group-hover:opacity-100 p-1.5 text-[#76777d] hover:text-[#006c49] hover:bg-[#f0fdf4] rounded-lg transition-all" title="Renombrar">
                                                                    <AppIcon name="pencil" size={14} />
                                                                </button>
                                                                <button
                                                                    onClick={() => handleDeletePreset(cat, catViewType)}
                                                                    className="opacity-0 group-hover:opacity-100 p-1.5 text-[#76777d] hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all" title="Eliminar">
                                                                    <AppIcon name="trash-2" size={14} />
                                                                </button>
                                                            </>
                                                        )}
                                                    </div>
                                                );
                                            })}

                                            {/* ── Sección Personalizadas ── */}
                                            <div className="px-5 py-2.5 bg-[#f8f9ff] flex justify-between items-center">
                                                <span className="text-[10px] font-black text-[#76777d] uppercase tracking-wider flex items-center gap-1.5">
                                                    <AppIcon name="user" size={12} /> Creadas por ti
                                                    <span className="bg-[#e5eeff] text-[#45464d] px-1.5 py-0.5 rounded-full ml-1">{customCategories[catViewType].length}</span>
                                                </span>
                                                <span className="text-[9px] text-[#76777d] font-medium">Renombrables y eliminables</span>
                                            </div>

                                            {customCategories[catViewType].length === 0 ? (
                                                <div className="px-5 py-6 text-center text-xs text-[#76777d] italic">
                                                    No tienes categorías personalizadas de {catViewType === 'Gasto' ? 'Gastos' : 'Ingresos'} todavía.
                                                    Crea una con el formulario de arriba.
                                                </div>
                                            ) : (
                                                customCategories[catViewType].map((cat, idx) => {
                                                    const isEditing = editingCat && editingCat.oldName === cat && !editingCat.isPreset && editingCat.type === catViewType;
                                                    return (
                                                        <div key={cat + idx}
                                                            className={`px-5 py-3 flex items-center gap-3 group transition-colors ${isEditing ? 'bg-[#f0fdf4]/40' : 'hover:bg-[#f8f9ff]'}`}>
                                                            <span className={`w-2 h-2 rounded-full shrink-0 ${catViewType === 'Gasto' ? 'bg-rose-300' : 'bg-teal-300'}`} />

                                                            {isEditing ? (
                                                                <>
                                                                    <input
                                                                        autoFocus
                                                                        type="text"
                                                                        value={editingCat.newName}
                                                                        onChange={e => setEditingCat(prev => ({ ...prev, newName: e.target.value }))}
                                                                        onKeyDown={e => { if (e.key === 'Enter') handleEditSave(); if (e.key === 'Escape') setEditingCat(null); }}
                                                                        className="flex-1 px-3 py-1.5 border-2 border-[#4edea3] rounded-lg text-sm font-semibold text-[#0b1c30] bg-white outline-none"
                                                                    />
                                                                    <button onClick={handleEditSave}
                                                                        className="p-1.5 bg-[#006c49] text-white rounded-lg hover:bg-[#006c49] shrink-0">
                                                                        <AppIcon name="check" size={14} />
                                                                    </button>
                                                                    <button onClick={() => setEditingCat(null)}
                                                                        className="p-1.5 bg-[#e5eeff] text-[#45464d] rounded-lg hover:bg-slate-300 shrink-0">
                                                                        <AppIcon name="x" size={14} />
                                                                    </button>
                                                                </>
                                                            ) : (
                                                                <>
                                                                    <span className="flex-1 font-semibold text-[#0b1c30] text-sm">{cat}</span>
                                                                    <span className="text-[9px] bg-[#f0fdf4] text-[#006c49] px-2 py-0.5 rounded-full font-bold uppercase hidden sm:inline">Personalizada</span>
                                                                    <button
                                                                        onClick={() => setEditingCat({ type: catViewType, oldName: cat, newName: cat, isPreset: false })}
                                                                        className="opacity-0 group-hover:opacity-100 p-1.5 text-[#76777d] hover:text-[#006c49] hover:bg-[#f0fdf4] rounded-lg transition-all" title="Renombrar">
                                                                        <AppIcon name="pencil" size={14} />
                                                                    </button>
                                                                    <button
                                                                        onClick={() => triggerDeleteCategory(cat, catViewType)}
                                                                        className="opacity-0 group-hover:opacity-100 p-1.5 text-[#76777d] hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all" title="Eliminar">
                                                                        <AppIcon name="trash-2" size={14} />
                                                                    </button>
                                                                </>
                                                            )}
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>

                                        {/* Footer con totales */}
                                        <div className="px-5 py-3 bg-[#f8f9ff] border-t border-[#e0e4f4] flex justify-between items-center">
                                            <span className="text-xs text-[#45464d] font-medium">
                                                Total {catViewType === 'Gasto' ? 'Gastos' : 'Ingresos'}: <strong className="text-[#0b1c30]">{mergedCategories[catViewType].length} categorías activas</strong>
                                            </span>
                                            <span className="text-[10px] text-[#76777d]">
                                                {presetCategories[catViewType].length} sistema · {customCategories[catViewType].length} personalizadas
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            )} {/* fin configSubTab === 'categories' */}

                            {/* ── Sub-tab: GENERAL (Moneda + preferencias) ── */}
                            {configSubTab === 'general' && (
                                <div className="space-y-5 animate-fade-in">

                                    {/* Selector de moneda */}
                                    <div className="bg-white rounded-2xl border border-[#e0e4f4] shadow-sm overflow-hidden">
                                        <div className="p-5 border-b border-[#e0e4f4] flex items-center gap-3">
                                            <div className="w-10 h-10 rounded-xl bg-[#e6fef4] flex items-center justify-center">
                                                <span className="material-symbols-outlined mat-fill text-[#006c49] text-[22px]">payments</span>
                                            </div>
                                            <div>
                                                <h3 className="text-base font-bold text-[#0b1c30]">Moneda de la Aplicación</h3>
                                                <p className="text-xs text-[#45464d]">Todos los montos se mostrarán en la moneda seleccionada</p>
                                            </div>
                                        </div>
                                        <div className="p-5 space-y-3">
                                            {CURRENCIES.map(cur => (
                                                <button key={cur.code} onClick={() => handleCurrencyChange(cur.code)}
                                                    className={`w-full flex items-center justify-between p-4 rounded-xl border-2 transition-all ${
                                                        selectedCurrency === cur.code
                                                        ? 'border-[#006c49] bg-[#f0fdf4]'
                                                        : 'border-[#e0e4f4] bg-white hover:border-[#c6c6cd] hover:bg-[#f8f9ff]'
                                                    }`}>
                                                    <div className="flex items-center gap-3">
                                                        <span className={`text-2xl font-black w-10 text-center ${selectedCurrency === cur.code ? 'text-[#006c49]' : 'text-[#45464d]'}`}>{cur.symbol}</span>
                                                        <div className="text-left">
                                                            <p className={`text-sm font-bold ${selectedCurrency === cur.code ? 'text-[#006c49]' : 'text-[#0b1c30]'}`}>{cur.label}</p>
                                                            <p className="text-xs text-[#76777d]">Ejemplo: {new Intl.NumberFormat(cur.locale, {style:'currency',currency:cur.code,minimumFractionDigits:0}).format(1500000)}</p>
                                                        </div>
                                                    </div>
                                                    {selectedCurrency === cur.code && (
                                                        <span className="material-symbols-outlined mat-fill text-[#006c49] text-[22px]">check_circle</span>
                                                    )}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Info de la cuenta */}
                                    <div className="bg-white rounded-2xl border border-[#e0e4f4] p-5 space-y-3">
                                        <h3 className="text-base font-bold text-[#0b1c30] flex items-center gap-2">
                                            <span className="material-symbols-outlined text-[#006c49] text-[20px]">account_circle</span>
                                            Cuenta Activa
                                        </h3>
                                        <div className="bg-[#f8f9ff] rounded-xl p-4 space-y-2">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs text-[#45464d] font-semibold uppercase">Correo</span>
                                                <span className="text-sm font-bold text-[#0b1c30]">{user?.email}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs text-[#45464d] font-semibold uppercase">Modo</span>
                                                <span className={`text-xs font-bold px-2 py-1 rounded-full ${hasValidApiKey ? 'bg-[#e6fef4] text-[#006c49]' : 'bg-amber-100 text-amber-700'}`}>
                                                    {hasValidApiKey ? '☁ Firebase' : '💾 Local'}
                                                </span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs text-[#45464d] font-semibold uppercase">Moneda activa</span>
                                                <span className="text-sm font-bold text-[#006c49]">{currencyDef?.symbol} {selectedCurrency}</span>
                                            </div>
                                        </div>
                                        <button onClick={handleLogout}
                                            className="w-full mt-2 py-3 flex items-center justify-center gap-2 text-sm font-semibold text-[#ba1a1a] hover:bg-[#ffdad6] rounded-xl border border-[#ffdad6] transition-all">
                                            <span className="material-symbols-outlined text-[18px]">logout</span>
                                            Cerrar Sesión
                                        </button>
                                    </div>

                                </div>
                            )} {/* fin configSubTab === 'general' */}

                                </div>
                            )} {/* fin activeTab === 'config' */}

                            {/* TAB: CONTROL DE EFECTIVO */}
                            {activeTab === 'cash' && (
                                <div className="space-y-6 animate-fade-in text-[#0b1c30]">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-[#e0e4f4] flex items-start gap-4">
                                        <div className="p-3 bg-[#f0fdf4] text-[#006c49] rounded-xl hidden sm:block"><AppIcon name="sparkles" /></div>
                                        <div>
                                            <h2 className="text-lg font-black text-[#0b1c30]">Monitoreo de Liquidez Proyectada</h2>
                                            <p className="text-xs text-[#45464d] mt-1 leading-relaxed">Controla el dinero en cuentas bancarias o efectivo físico. El sistema calculará y proyectará tus saldos descontando tus egresos presupuestados pendientes del mes ({MONTH_NAMES[selectedMonth]}).</p>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-[#e0e4f4] space-y-2">
                                            <label className="block text-xs font-bold text-[#45464d] uppercase flex items-center gap-1.5"><AppIcon name="landmark" size={13} /> Disponible Bancos</label>
                                            <input type="text" value={cashInputs.juan} onChange={(e) => handleCashFieldInputChange('juan', e.target.value)} placeholder="$ 0" className="w-full p-2.5 border border-[#c6c6cd] rounded-xl bg-[#f8f9ff] text-base font-bold text-[#0b1c30]" />
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-[#e0e4f4] space-y-2">
                                            <label className="block text-xs font-bold text-[#45464d] uppercase flex items-center gap-1.5"><AppIcon name="banknote" size={13} /> Disponible Efectivo</label>
                                            <input type="text" value={cashInputs.sindy} onChange={(e) => handleCashFieldInputChange('sindy', e.target.value)} placeholder="$ 0" className="w-full p-2.5 border border-[#c6c6cd] rounded-xl bg-[#f8f9ff] text-base font-bold text-[#0b1c30]" />
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-[#e0e4f4] space-y-2">
                                            <label className="block text-xs font-bold text-[#45464d] uppercase">Otros Disponibles</label>
                                            <input type="text" value={cashInputs.otros} onChange={(e) => handleCashFieldInputChange('otros', e.target.value)} placeholder="$ 0" className="w-full p-2.5 border border-[#c6c6cd] rounded-xl bg-[#f8f9ff] text-base font-bold text-[#0b1c30]" />
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-rose-100 bg-rose-50/10 space-y-2">
                                            <label className="block text-xs font-bold text-rose-600 uppercase flex items-center gap-1.5"><AppIcon name="credit-card" size={14} /> Deuda Tarjetas</label>
                                            <input type="text" value={cashInputs.tarjetaCredito} onChange={(e) => handleCashFieldInputChange('tarjetaCredito', e.target.value)} placeholder="$ 0" className="w-full p-2.5 border border-rose-200 rounded-xl bg-rose-50/50 text-base font-bold text-rose-800" />
                                        </div>
                                    </div>

                                    <div className="bg-[#131b2e] rounded-2xl p-6 text-white grid grid-cols-1 md:grid-cols-4 gap-6 shadow-xl">
                                        <div>
                                            <p className="text-xs text-[#76777d] uppercase font-extrabold tracking-wider">A. Total Efectivo</p>
                                            <p className="text-xl font-black text-slate-100">{formatCOP(stats.totalEfectivoCaja)}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-[#76777d] uppercase font-extrabold text-amber-400 tracking-wider">B. Gastos Proyectados</p>
                                            <p className="text-xl font-black text-amber-400">-{formatCOP(stats.totalGastosPendientesReservar)}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-[#76777d] uppercase font-extrabold text-rose-400 tracking-wider">C. Deudas Ingresadas</p>
                                            <p className="text-xl font-black text-rose-400">-{formatCOP(cashFlowData.tarjetaCredito)}</p>
                                        </div>
                                        <div className="bg-[#1e2d45] p-3 rounded-xl">
                                            <p className="text-xs text-[#4edea3] uppercase font-extrabold tracking-wider">Disponible Real (A-B-C)</p>
                                            <p className={`text-2xl font-black ${stats.disponibleReal >= 0 ? 'text-[#4edea3]' : 'text-rose-400'}`}>{formatCOP(stats.disponibleReal)}</p>
                                        </div>
                                    </div>

                                    {/* Exclusión de Gastos */}
                                    <div className="bg-white rounded-2xl shadow-sm border border-[#e0e4f4] p-6 text-[#0b1c30]">
                                        <h3 className="text-base font-bold text-[#0b1c30] mb-2 flex items-center gap-1.5"><AppIcon name="check-square" /> Exclusión de Gastos Mensuales</h3>
                                        <p className="text-xs text-[#76777d] mb-4 font-medium">Marca los gastos presupuestados que **no pagarás este mes**. Se excluirán del cálculo de liquidez.</p>
                                        <div className="divide-y divide-slate-100 max-h-96 overflow-y-auto pr-2">
                                            {stats.breakdown.filter(item => item.type === 'Gasto').map((item, idx) => (
                                                <div key={idx} className={`py-3 flex justify-between items-center transition-colors ${item.excluido ? 'opacity-50' : ''}`}>
                                                    <div className="flex items-center gap-3">
                                                        <button onClick={() => toggleCategoryExclusion(item.category)} className="text-[#76777d] hover:text-[#006c49]">
                                                            {item.excluido ? <AppIcon name="square" className="text-rose-400" /> : <AppIcon name="check-square" className="text-[#006c49]" />}
                                                        </button>
                                                        <span className="text-sm font-bold text-[#0b1c30]">{item.category}</span>
                                                    </div>
                                                    <span className="text-xs font-bold text-[#45464d]">Pendiente: {formatCOP(item.pendiente)}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )} {/* fin activeTab === 'cash' */}

                        </main>

                        {/* Barra de Navegación Inferior (Móvil) */}
                        <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-[#e0e4f4] flex justify-around items-center px-2 pt-2 pb-4 shadow-[0_-8px_20px_-4px_rgba(0,0,0,0.08)] z-40">
                            <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center gap-1 px-3 py-2 rounded-2xl transition-all ${activeTab === 'dashboard' ? 'text-[#006c49] bg-[#f0fdf4]' : 'text-[#76777d]'}`}>
                                <AppIcon name="pie-chart" size={22} /><span className="text-[10px] font-black">Resumen</span>
                            </button>
                            <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center gap-1 px-3 py-2 rounded-2xl transition-all ${activeTab === 'history' ? 'text-[#006c49] bg-[#f0fdf4]' : 'text-[#76777d]'}`}>
                                <AppIcon name="list" size={22} /><span className="text-[10px] font-black">Historial</span>
                            </button>
                            <button onClick={() => { resetWizard(); setActiveTab('add'); }}
                                className={`flex flex-col items-center justify-center gap-1 px-5 py-3 rounded-2xl shadow-lg -mt-5 ring-4 ring-white transition-all active:scale-95 ${activeTab === 'add' ? 'bg-[#005236]' : 'bg-[#006c49]'}`}>
                                <AppIcon name="plus" size={26} className="text-white" /><span className="text-[10px] font-black text-white">Nuevo</span>
                            </button>
                            <button onClick={() => setActiveTab('cash')} className={`flex flex-col items-center gap-1 px-3 py-2 rounded-2xl transition-all ${activeTab === 'cash' ? 'text-[#006c49] bg-[#f0fdf4]' : 'text-[#76777d]'}`}>
                                <AppIcon name="wallet" size={22} /><span className="text-[10px] font-black">Efectivo</span>
                            </button>
                            <button onClick={() => setActiveTab('config')} className={`flex flex-col items-center gap-1 px-3 py-2 rounded-2xl transition-all ${activeTab === 'config' ? 'text-[#006c49] bg-[#f0fdf4]' : 'text-[#76777d]'}`}>
                                <AppIcon name="settings" size={22} /><span className="text-[10px] font-black">Config.</span>
                            </button>
                        </nav>

                    </div>
                );
            }

            // Renderizar la aplicación de React en el nodo root
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<MainApp />);
        }
    </script>
</body>
</html>
