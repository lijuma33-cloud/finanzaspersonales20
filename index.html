    <!-- Importación de SDKs de Firebase v11.6.1 (Auth y Firestore) con salvaguarda robusta -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword,

        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            query, 
            deleteDoc, 
            doc, 
            setDoc 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Exponer Firebase al entorno global de la página
        window.FirebaseSDK = {
            initializeApp,
            getAuth,
            signInWithEmailAndPassword,

<body class="bg-[#f8f9ff] text-[#0b1c30] min-h-screen font-sans">

    <!-- Nodo principal donde se montará la App de React -->

    <script type="text/babel">
        // Esperamos a que los SDKs de Firebase o el entorno global estén disponibles
        const checkFirebaseInterval = setInterval(() => {
            if (window.FirebaseSDK) {
                clearInterval(checkFirebaseInterval);
                initReactApplication();
            }
        }, 100);

        function initReactApplication() {
            const { useState, useEffect, useMemo, useRef } = React;
            const { 
                initializeApp, getAuth, signInWithEmailAndPassword, 
                createUserWithEmailAndPassword, signOut, onAuthStateChanged, 
                getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc, setDoc 
            } = window.FirebaseSDK;

            // ═══════════════════════════════════════════════════════════════
            // 🔧  CONFIGURACIÓN DE FIREBASE — EDITA ESTA SECCIÓN
            //     Reemplaza cada valor con los datos de tu proyecto Firebase.
            //     Consola Firebase → ⚙️ Project Settings → Your apps → Config
            //     Después de editar, guarda y sube el archivo a Netlify.
            // ═══════════════════════════════════════════════════════════════
            const FIREBASE_CONFIG = {
                apiKey:            "AIzaSyAWKe1e_sPdTlGjP8CqXSPo-9dQItu2ScE",
                authDomain:        "finanzas-personales-b5983.firebaseapp.com",
                projectId:         "finanzas-personales-b5983",
                storageBucket:     "finanzas-personales-b5983.firebasestorage.app",
                messagingSenderId: "900800646807",
                appId:             "1:900800646807:web:c8734bd2fdbfa59d4a63d2"
            };
            // ═══════════════════════════════════════════════════════════════

            // Cadena de prioridad para resolver la configuración activa:
            //  1. Config hardcodeada arriba (si ya fue editada con valores reales)
            //  2. Variable de entorno inyectada por Netlify (__firebase_config)
            //  3. Config guardada por el usuario en localStorage (panel UI)
            //  4. null → modo demostración local
            const _hardcoded  = FIREBASE_CONFIG.apiKey !== "PEGA-TU-API-KEY-AQUÍ" ? FIREBASE_CONFIG : null;
            const _envConfig  = (() => { try { return typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null; } catch(e) { return null; } })();
            const _savedLocal = (() => { try { return JSON.parse(localStorage.getItem('firebase_config_saved') || 'null'); } catch(e) { return null; } })();

            const rawFirebaseConfig = (_hardcoded?.apiKey)  ? _hardcoded
                                    : (_envConfig?.apiKey)  ? _envConfig
                                    : (_savedLocal?.apiKey) ? _savedLocal
                                    : null;

            // Evaluamos si las credenciales de Firebase son válidas (tienen API Key)
            const hasValidApiKey = !!(rawFirebaseConfig && rawFirebaseConfig.apiKey && rawFirebaseConfig.apiKey.trim() !== "");
            
            let app = null;
            let auth = null;
            let db = null;
            const appId = 'finanzas-familia-app';

            if (hasValidApiKey) {
                try {
                    app = initializeApp(rawFirebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);
                } catch (e) {
                    console.error("Error al inicializar Firebase Real:", e);
                }
            }

            // --- CATEGORÍAS INICIALES --- vacías: cada usuario crea las suyas
            const INITIAL_CATEGORIES = {
                Ingreso: [],
                Gasto:   []
            };

            // --- ÍCONOS MATERIAL SYMBOLS POR CATEGORÍA ---
            // Se usan en la pantalla del wizard al seleccionar categoría
            const CAT_ICONS = {
                // Gastos frecuentes
                'Mercado': 'shopping_cart', 'Supermercado': 'shopping_cart',
                'Comida': 'restaurant', 'Restaurante': 'restaurant', 'Almuerzos': 'lunch_dining',
                'Transporte': 'directions_car', 'Gasolina': 'local_gas_station', 'Parqueadero': 'local_parking',
                'Salud': 'health_and_safety', 'Médico': 'medical_services', 'Farmacia': 'local_pharmacy',
                'Educación': 'school', 'Universidad': 'school',
                'Servicios': 'bolt', 'Energía': 'bolt', 'Energia': 'bolt', 'Acueducto': 'water_drop', 'Gas Natural': 'local_fire_department',
                'Internet': 'wifi', 'Celular': 'smartphone', 'Cel Juan': 'smartphone', 'Cel Sindy': 'smartphone',
                'Entretenimiento': 'movie', 'Streaming': 'play_circle', 'Música': 'music_note',
                'Ropa': 'checkroom', 'Compras': 'shopping_bag',
                'Viajes': 'flight', 'Vacaciones': 'beach_access',
                'Hogar': 'home', 'Arriendo': 'home', 'Crédito Apto': 'apartment',
                'Mascotas': 'pets',
                'Gimnasio': 'fitness_center', 'Deporte': 'sports',
                'Tarjeta': 'credit_card', 'Cuota': 'payments',
                'Ahorros': 'savings', 'Inversión': 'trending_up',
                'Diezmo': 'volunteer_activism', 'Ofrenda': 'volunteer_activism', 'Ayuda': 'favorite',
                'Otros': 'more_horiz', 'Varios': 'category',
                // Ingresos
                'Salario': 'account_balance', 'Sueldo': 'account_balance',
                'Freelance': 'laptop', 'Consultoría': 'business_center',
                'Arriendo': 'home', 'Alquiler': 'home',
                'Dividendos': 'trending_up', 'Inversiones': 'trending_up',
                'Bonificación': 'star', 'Prima': 'card_giftcard', 'Vacaciones': 'beach_access',
                'Ventas': 'store',
            };

            const getCatIcon = (name, iconMap) => {
                if (!name) return 'label';
                if (iconMap && iconMap[name]) return iconMap[name];
                if (CAT_ICONS[name]) return CAT_ICONS[name];
                const lower = name.toLowerCase();
                for (const [key, icon] of Object.entries(CAT_ICONS)) {
                    if (lower.includes(key.toLowerCase()) || key.toLowerCase().includes(lower)) return icon;
                }
                return 'label';
            };

            // Todos los íconos disponibles para el selector
            const ICON_OPTIONS = [
                // Finanzas
                {i:'payments',label:'Pagos'},{i:'account_balance',label:'Banco'},{i:'savings',label:'Ahorros'},{i:'credit_card',label:'Tarjeta'},{i:'trending_up',label:'Inversión'},{i:'trending_down',label:'Baja'},{i:'attach_money',label:'Dinero'},{i:'money_off',label:'Gasto'},
                // Hogar
                {i:'home',label:'Hogar'},{i:'apartment',label:'Apto'},{i:'bed',label:'Dormitorio'},{i:'local_fire_department',label:'Gas'},{i:'bolt',label:'Luz'},{i:'water_drop',label:'Agua'},{i:'wifi',label:'Internet'},{i:'tv',label:'TV'},
                // Comida
                {i:'restaurant',label:'Restaurante'},{i:'lunch_dining',label:'Almuerzo'},{i:'local_cafe',label:'Café'},{i:'bakery_dining',label:'Panadería'},{i:'fastfood',label:'Comida rápida'},{i:'grocery',label:'Mercado'},{i:'shopping_cart',label:'Compras'},
                // Transporte
                {i:'directions_car',label:'Carro'},{i:'local_gas_station',label:'Gasolina'},{i:'local_parking',label:'Parqueadero'},{i:'directions_bus',label:'Bus'},{i:'flight',label:'Avión'},{i:'train',label:'Tren'},{i:'two_wheeler',label:'Moto'},
                // Salud
                {i:'health_and_safety',label:'Salud'},{i:'medical_services',label:'Médico'},{i:'local_pharmacy',label:'Farmacia'},{i:'fitness_center',label:'Gimnasio'},{i:'psychology',label:'Psicología'},{i:'spa',label:'Bienestar'},
                // Educación
                {i:'school',label:'Colegio'},{i:'menu_book',label:'Libros'},{i:'laptop',label:'Tecnología'},{i:'science',label:'Ciencia'},{i:'workspace_premium',label:'Curso'},
                // Entretenimiento
                {i:'movie',label:'Cine'},{i:'music_note',label:'Música'},{i:'sports_esports',label:'Juegos'},{i:'sports',label:'Deporte'},{i:'beach_access',label:'Vacaciones'},{i:'celebration',label:'Fiesta'},{i:'play_circle',label:'Streaming'},
                // Persona
                {i:'person',label:'Personal'},{i:'family_restroom',label:'Familia'},{i:'child_care',label:'Niños'},{i:'pets',label:'Mascotas'},{i:'volunteer_activism',label:'Donación'},{i:'favorite',label:'Amor'},{i:'checkroom',label:'Ropa'},{i:'face',label:'Belleza'},
                // Trabajo
                {i:'work',label:'Trabajo'},{i:'business_center',label:'Negocio'},{i:'store',label:'Tienda'},{i:'handshake',label:'Contrato'},{i:'receipt_long',label:'Factura'},{i:'card_giftcard',label:'Regalo'},
                // Otros
                {i:'category',label:'General'},{i:'label',label:'Etiqueta'},{i:'more_horiz',label:'Otros'},{i:'star',label:'Favorito'},{i:'flag',label:'Meta'},
            ];

            const MONTH_NAMES = [
                'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
            ];

            // ── MONEDAS DISPONIBLES ──────────────────────────────────────────
            const CURRENCIES = [
                { code:'COP', symbol:'$',  locale:'es-CO', label:'Peso Colombiano (COP)' },
                { code:'USD', symbol:'US$',locale:'en-US', label:'Dólar Estadounidense (USD)' },
                { code:'EUR', symbol:'€',  locale:'de-DE', label:'Euro (EUR)' },
                { code:'MXN', symbol:'$',  locale:'es-MX', label:'Peso Mexicano (MXN)' },
                { code:'ARS', symbol:'$',  locale:'es-AR', label:'Peso Argentino (ARS)' },
                { code:'CLP', symbol:'$',  locale:'es-CL', label:'Peso Chileno (CLP)' },
                { code:'PEN', symbol:'S/', locale:'es-PE', label:'Sol Peruano (PEN)' },
                { code:'BRL', symbol:'R$', locale:'pt-BR', label:'Real Brasileño (BRL)' },
                { code:'GBP', symbol:'£',  locale:'en-GB', label:'Libra Esterlina (GBP)' },
                { code:'CAD', symbol:'CA$',locale:'en-CA', label:'Dólar Canadiense (CAD)' },
                { code:'JPY', symbol:'¥',  locale:'ja-JP', label:'Yen Japonés (JPY)' },
                { code:'CHF', symbol:'Fr', locale:'de-CH', label:'Franco Suizo (CHF)' },
            ];

            // formatCOP se redefine dentro de MainApp como formatAmount() usando selectedCurrency
            // Esta versión estática es solo fallback para el scope global
            const formatCOP = (monto) => {
                const saved = (() => { try { return localStorage.getItem('zo_currency') || 'COP'; } catch(e){ return 'COP'; } })();
                const cur = CURRENCIES.find(c => c.code === saved) || CURRENCIES[0];
                return new Intl.NumberFormat(cur.locale, {
                    style: 'currency', currency: cur.code,
                    minimumFractionDigits: 0, maximumFractionDigits: 0
                }).format(monto || 0);
            };

            const cleanCurrencyToNumber = (valString) => {
                if (valString === undefined || valString === null) return 0;
                const cleaned = valString.toString().replace(/[^0-9]/g, '');
                return parseFloat(cleaned) || 0;
            };

            const formatInputOnTheFly = (value) => {
                if (!value) return '';
                const num = cleanCurrencyToNumber(value);
                if (num === 0) return '';
                // Formato con separadores de miles, sin símbolo (solo para inputs)
                return new Intl.NumberFormat('es-CO', {
                    minimumFractionDigits: 0, maximumFractionDigits: 0
                }).format(num);
            };

            // Formatea número con separadores de miles + símbolo según moneda activa
            // Usada en inputs de presupuesto para mostrar "1.500.000" mientras se escribe
            const formatThousands = (value) => {
                if (!value) return '';
                const cleaned = value.toString().replace(/[^0-9]/g, '');
                if (!cleaned) return '';
                return new Intl.NumberFormat('es-CO', {
                    minimumFractionDigits: 0, maximumFractionDigits: 0
                }).format(parseInt(cleaned, 10));
            };

            // Componente de Iconos Portable
            function AppIcon({ name, className = "w-5 h-5", size = 20 }) {
                useEffect(() => {
                    if (window.lucide) {
                        window.lucide.createIcons();
                    }
                }, [name]);
                return <i data-lucide={name} class={className} style={{ width: size, height: size }}></i>;
            }

            // Componente Principal
            function MainApp() {
                const [user, setUser] = useState(null);
                const [authLoading, setAuthLoading] = useState(true);
                
                // Estados de login
                const [isRegistering, setIsRegistering] = useState(false);
                const [email, setEmail] = useState('');
                const [password, setPassword] = useState('');

                // Estados para el panel de configuración de Firebase
                const [showFirebasePanel, setShowFirebasePanel] = useState(false);
                const [fbConfigInputs, setFbConfigInputs] = useState({
                    apiKey: '', authDomain: '', projectId: '',
                    storageBucket: '', messagingSenderId: '', appId: ''
                });
                const [fbSaveStatus, setFbSaveStatus] = useState('');

                // Estados de la app
                const [transactions, setTransactions] = useState([]);
                const [customCategories, setCustomCategories] = useState({ Ingreso: [], Gasto: [] });
                const [budgets, setBudgets] = useState({}); 
                const [cashFlowData, setCashFlowData] = useState({
                    juan: 0,
                    sindy: 0,
                    otros: 0,
                    tarjetaCredito: 0,
                    excluidos: []
                });

                const [activeTab, setActiveTab] = useState('dashboard'); 
                const [loading, setLoading] = useState(false);

                // Filtros de tiempo globales
                const [filterMode, setFilterMode] = useState('single'); 
                const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth()); 
                const [rangeStart, setRangeStart] = useState(0);
                const [rangeEnd, setRangeEnd] = useState(11);
                const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());

                // Alertas y Confirmaciones
                const [toast, setToast] = useState(null);
                const [confirmModal, setConfirmModal] = useState(null);

                // Estados de formularios
                const [formData, setFormData] = useState({
                    type: 'Gasto',
                    date: new Date().toISOString().split('T')[0],
                    category: '',
                    amountText: '', 
                    description: ''
                });

                const [newCatName, setNewCatName] = useState('');
                const [newCatType, setNewCatType] = useState('Gasto');

                // ── Wizard de registro paso a paso ───────────────────────────
                const [wizardStep, setWizardStep]           = useState(0);
                const [wizardData, setWizardData]           = useState({ type: 'Gasto', category: '', amountStr: '', date: new Date().toISOString().split('T')[0], description: '' });
                const [wizardNewCat, setWizardNewCat]       = useState(false);
                const [wizardNewCatName, setWizardNewCatName]     = useState('');
                const [wizardNewCatBudget, setWizardNewCatBudget] = useState('');
                const [wizardBudgetScope, setWizardBudgetScope]   = useState('month'); // 'month' | 'all'
                // Sub-tab activo dentro de Configuración: 'budget' | 'categories'
                const [configSubTab, setConfigSubTab] = useState('budget');
                // Filtro de período colapsable
                const [showFilter, setShowFilter] = useState(false);

                // ── Moneda seleccionada ──────────────────────────────────────
                const [selectedCurrency, setSelectedCurrency] = useState(() => {
                    try { return localStorage.getItem('zo_currency') || 'COP'; } catch(e) { return 'COP'; }
                });
                const currencyDef = CURRENCIES.find(c => c.code === selectedCurrency) || CURRENCIES[0];
                // Sobreescribe el formatCOP global con la moneda elegida por el usuario
                const formatCOP = (monto) => new Intl.NumberFormat(currencyDef.locale, {
                    style: 'currency', currency: currencyDef.code,
                    minimumFractionDigits: 0, maximumFractionDigits: 0
                }).format(monto || 0);

                const handleCurrencyChange = (code) => {
                    setSelectedCurrency(code);
                    try { localStorage.setItem('zo_currency', code); } catch(e) {}
                };

                // ── Íconos por categoría (persistidos) ───────────────────────
                const [categoryIcons, setCategoryIcons] = useState({});
                // Selector de ícono en formulario de nueva categoría
                const [wizardIconPicker, setWizardIconPicker]     = useState(false);
                const [wizardSelectedIcon, setWizardSelectedIcon] = useState('label');
                const [configNewCatIcon, setConfigNewCatIcon]     = useState('label');
                const [configIconPicker, setConfigIconPicker]     = useState(false);
                // ícono sugerido al escribir el nombre
                const [wizardBudgetStep, setWizardBudgetStep]     = useState(false); // pregunta presupuesto al elegir cat existente

                // Estado para categorías preestablecidas editables
                const [presetCategories, setPresetCategories] = useState({
                    Ingreso: [...INITIAL_CATEGORIES.Ingreso],
                    Gasto: [...INITIAL_CATEGORIES.Gasto]
                });
                // Filtro activo en el panel de categorías: 'Gasto' | 'Ingreso'
                const [catViewType, setCatViewType] = useState('Gasto');
                // Categoría en modo edición inline: { type, oldName, newName, isPreset }
                const [editingCat, setEditingCat] = useState(null);

                const [selectedBudgetCategory, setSelectedBudgetCategory] = useState('');
                const [targetBudgetMonth, setTargetBudgetMonth] = useState('all'); 
                const [bulkBudgetValueText, setBulkBudgetValueText] = useState('');

                const [cashInputs, setCashInputs] = useState({
                    juan: '',
                    sindy: '',
                    otros: '',
                    tarjetaCredito: ''
                });

                // Unión de categorías preestablecidas (editables) + personalizadas
                const mergedCategories = useMemo(() => {
                    return {
                        Ingreso: [...presetCategories.Ingreso, ...customCategories.Ingreso],
                        Gasto: [...presetCategories.Gasto, ...customCategories.Gasto]
                    };
                }, [customCategories, presetCategories]);

                // Sincronizar categorías en el selector de transacciones
                useEffect(() => {
                    const list = mergedCategories[formData.type];
                    if (list && list.length > 0) {
                        if (!formData.category || !list.includes(formData.category)) {
                            setFormData(prev => ({
                                ...prev,
                                category: list[0]
                            }));
                        }
                    }
                }, [formData.type, mergedCategories]);

                const showToast = (message, type = 'success') => {
                    setToast({ message, type });
                    setTimeout(() => setToast(null), 4000);
                };

                // --- MANEJADOR DE PERSISTENCIA SEGURA (FIREBASE / LOCALSTORAGE) ---
                useEffect(() => {
                    if (hasValidApiKey && auth) {
                        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                            setUser(currentUser);
                            setAuthLoading(false);
                        });
                        return () => unsubscribe();
                    } else {
                        // Modo Local (Sin API Key o en Preview de Canvas sin conectar)
                        const localUser = localStorage.getItem('local_finanzas_user');
                        if (localUser) {
                            setUser(JSON.parse(localUser));
                        }
                        setAuthLoading(false);
                    }
                }, []);

                const monthlyKey = `${selectedYear}_${selectedMonth}`;

                // Sincronización en tiempo real o local según disponibilidad de Firebase
                useEffect(() => {
                    if (!user) {
                        setTransactions([]);
                        setCustomCategories({ Ingreso: [], Gasto: [] });
                        setBudgets({});
                        return;
                    }
                    setLoading(true);

                    if (hasValidApiKey && db) {
                        // Sincronizar usando Firestore de Google Cloud
                        const qTrans = query(collection(db, 'artifacts', appId, 'users', user.uid, 'transactions'));
                        const unsubTrans = onSnapshot(qTrans, (snapshot) => {
                            const data = [];
                            snapshot.forEach((doc) => {
                                data.push({ id: doc.id, ...doc.data() });
                            });
                            data.sort((a, b) => new Date(b.date) - new Date(a.date));
                            setTransactions(data);
                            setLoading(false);
                        }, (err) => {
                            console.error(err);
                            showToast("Error de conexión al sincronizar movimientos", "error");
                        });

                        parsed[selectedBudgetCategory] = updatedMonths;
                        localStorage.setItem(`${userPrefix}budgets`, JSON.stringify(parsed));
                        
                        setBulkBudgetValueText('');
                        showToast(`Presupuesto guardado localmente.`);
                        window.dispatchEvent(new Event('localDataChanged'));
                    }
                };

                // ── CORRECCIÓN: evitar stale closure en cashFlowData ──────────
                // Antes: saveCashFieldToDb leía cashFlowData del closure (valor viejo),
                // causando que al editar varios campos en rápida sucesión el segundo campo
                // sobreescribiera el valor del primero con cero.
                // Solución: usar setState funcional para siempre tener el valor más reciente,
                // y pasar los datos frescos directamente a la función de guardado.
                const handleCashFieldInputChange = (field, textValue) => {
                    const formatted = formatInputOnTheFly(textValue);
                    const numValue = cleanCurrencyToNumber(textValue);
                    setCashInputs(prev => ({ ...prev, [field]: formatted }));
                    // Usamos el updater funcional para obtener el estado más reciente
                    // y pasamos el objeto completo a la función de guardado
                    setCashFlowData(prev => {
                        const updatedData = { ...prev, [field]: numValue };
                        saveCashDataToDb(updatedData); // datos frescos, sin closure stale
                        return updatedData;
                    });
                };

                const saveCashDataToDb = async (updatedData) => {
                    if (!user) return;
                    if (hasValidApiKey && db) {
                        try {
                            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cashFlows', monthlyKey), updatedData, { merge: true });
                        } catch (err) {
                            console.error("Error guardando cambios de efectivo:", err);
                            showToast("Error al guardar datos de efectivo", "error");
                        }
                    } else {
                        const userPrefix = `finanzas_${user.uid}_`;
                        localStorage.setItem(`${userPrefix}cashFlows_${monthlyKey}`, JSON.stringify(updatedData));
                        // No dispatching localDataChanged aquí porque ya actualizamos
                        // el estado directamente con setCashFlowData — evita doble render
                    }
                };

                const toggleCategoryExclusion = async (category) => {
                    if (!user) return;
                    let newExcluidos = [...cashFlowData.excluidos];
                    if (newExcluidos.includes(category)) {
                        newExcluidos = newExcluidos.filter(c => c !== category);
                    } else {
                        newExcluidos.push(category);
                    }

                    const updatedData = { ...cashFlowData, excluidos: newExcluidos };
                    setCashFlowData(updatedData);

                    if (hasValidApiKey && db) {
                        try {
                            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cashFlows', monthlyKey), updatedData, { merge: true });
                        } catch (err) {
                            console.error("Error guardando exclusión:", err);
                        }
                    } else {
                        const userPrefix = `finanzas_${user.uid}_`;
                        localStorage.setItem(`${userPrefix}cashFlows_${monthlyKey}`, JSON.stringify(updatedData));
                        window.dispatchEvent(new Event('localDataChanged'));
                    }
                };

                // --- PROCESAMIENTO ANALÍTICO ---
                const stats = useMemo(() => {
                    const activeMonths = [];
                    if (filterMode === 'single') {
                        activeMonths.push(selectedMonth);
                    } else if (filterMode === 'range') {
                        const start = Math.min(rangeStart, rangeEnd);
                        const end = Math.max(rangeStart, rangeEnd);
                        for (let m = start; m <= end; m++) {
                            activeMonths.push(m);
                        }
                    } else {
                        for (let m = 0; m < 12; m++) activeMonths.push(m);
                    }

                    const filteredTrans = transactions.filter(t => {
                        const d = new Date(t.date);
                        return d.getFullYear() === selectedYear && activeMonths.includes(d.getMonth());
                    });

                    let totalIngresosReal = 0;
                    let totalGastosReal = 0;
                    const realPorCategoria = {};

                    filteredTrans.forEach(t => {
                        if (t.type === 'Ingreso') {
                            totalIngresosReal += t.amount;
                        } else {
                            totalGastosReal += t.amount;
                        }
                        realPorCategoria[t.category] = (realPorCategoria[t.category] || 0) + t.amount;
                    });

                    let totalIngresosPresupuesto = 0;
                    let totalGastosPresupuesto = 0;

                    mergedCategories.Ingreso.forEach(cat => {
                        let catBudgetSum = 0;
                        activeMonths.forEach(m => {
                            catBudgetSum += budgets[cat]?.[m] || 0;
                        });
                        totalIngresosPresupuesto += catBudgetSum;
                    });

                    mergedCategories.Gasto.forEach(cat => {
                        let catBudgetSum = 0;
                        activeMonths.forEach(m => {
                            catBudgetSum += budgets[cat]?.[m] || 0;
                        });
                        totalGastosPresupuesto += catBudgetSum;
                    });

                    const breakdown = [];
                    let totalGastosPendientesReservar = 0;

                    mergedCategories.Gasto.forEach(cat => {
                        const real = realPorCategoria[cat] || 0;
                        let presupuestado = 0;
                        activeMonths.forEach(m => {
                            presupuestado += budgets[cat]?.[m] || 0;
                        });
                        
                        const pendiente = Math.max(0, presupuestado - real);
                        const excluido = cashFlowData.excluidos.includes(cat);

                        if (!excluido) {
                            totalGastosPendientesReservar += pendiente;
                        }

                        const diferencia = presupuestado - real;
                        const ejecucion = presupuestado > 0 ? (real / presupuestado) * 100 : 0;

                        if (real > 0 || presupuestado > 0) {
                            breakdown.push({
                                category: cat,
                                type: 'Gasto',
                                real,
                                presupuestado,
                                pendiente,
                                excluido,
                                diferencia,
                                ejecucion
                            });
                        }
                    });

                    mergedCategories.Ingreso.forEach(cat => {
                        const real = realPorCategoria[cat] || 0;
                        let presupuestado = 0;
                        activeMonths.forEach(m => {
                            presupuestado += budgets[cat]?.[m] || 0;
                        });

                        const diferencia = real - presupuestado;
                        const ejecucion = presupuestado > 0 ? (real / presupuestado) * 100 : 0;

                        if (real > 0 || presupuestado > 0) {
                            breakdown.push({
                                category: cat,
                                type: 'Ingreso',
                                real,
                                presupuestado,
                                pendiente: 0,
                                excluido: false,
                                diferencia,
                                ejecucion
                            });
                        }
                    });

                    const topIngresos = breakdown
                        .filter(item => item.type === 'Ingreso' && item.real > 0)
                        .sort((a, b) => b.real - a.real)
                        .slice(0, 5);

                    const topGastos = breakdown
                        .filter(item => item.type === 'Gasto' && item.real > 0)
                        .sort((a, b) => b.real - a.real)
                        .slice(0, 5);

                    const saldoReal = totalIngresosReal - totalGastosReal;
                    const saldoPresupuesto = totalIngresosPresupuesto - totalGastosPresupuesto;

                    const totalEfectivoCaja = cashFlowData.juan + cashFlowData.sindy + cashFlowData.otros;
                    const disponibleReal = totalEfectivoCaja - totalGastosPendientesReservar - cashFlowData.tarjetaCredito;

                    return {
                        totalIngresosReal,
                        totalGastosReal,
                        totalIngresosPresupuesto,
                        totalGastosPresupuesto,
                        saldoReal,
                        saldoPresupuesto,
                        breakdown,
                        filteredTrans,
                        totalGastosPendientesReservar,
                        totalEfectivoCaja,
                        disponibleReal,
                        topIngresos,
                        topGastos,
                        activeMonths
                    };
                }, [transactions, customCategories, budgets, selectedMonth, rangeStart, rangeEnd, filterMode, selectedYear, mergedCategories, cashFlowData]);

                // --- RENDERS DE COMPONENTES ---

                if (!user && !authLoading) {
                    return (
                        <div className="min-h-screen bg-[#131b2e] flex flex-col justify-center items-center p-4">
                            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full space-y-6 animate-fade-in border border-[#c6c6cd]">
                                <div className="text-center space-y-2">

                                        <AppIcon name="dollar-sign" size={32} />
                                    </div>
                                    <h1 className="text-2xl font-extrabold text-[#0b1c30]">Zenith Order</h1>
                                    <p className="text-xs text-[#76777d]">
                                        {isRegistering ? "Crea una cuenta para guardar tus finanzas de forma segura" : "Inicia sesión para gestionar tus presupuestos familiares"}
                                    </p>
                                </div>

                                <form onSubmit={handleAuthSubmit} className="space-y-4">

                                        <label className="text-xs font-semibold text-[#45464d] uppercase tracking-wider">Correo electrónico</label>
                                        <div className="relative">

                                            <input 
                                                type="email"
                                                value={email}
                                                onChange={(e) => setEmail(e.target.value)}
                                                placeholder="ejemplo@correo.com"
                                                className="w-full p-2.5 pl-10 border border-[#c6c6cd] rounded-xl bg-[#f8f9ff] outline-none focus:ring-2 focus:ring-[#006c49] text-slate-850 font-medium text-sm"
                                                required
                                            />
                                        </div>
                                    </div>

                                    <div className="space-y-1">
                                        <label className="text-xs font-semibold text-[#45464d] uppercase tracking-wider">Contraseña</label>
                                        <div className="relative">
                                            <span className="absolute left-3 top-3 text-[#76777d]"><AppIcon name="lock" size={18} /></span>
                                            <input 
                                                type="password"
                                                value={password}
                                                onChange={(e) => setPassword(e.target.value)}
                                                placeholder="••••••••"
                                                className="w-full p-2.5 pl-10 border border-[#c6c6cd] rounded-xl bg-[#f8f9ff] outline-none focus:ring-2 focus:ring-[#006c49] text-slate-850 font-medium text-sm"
                                                required
                                            />
                                        </div>
                                    </div>

                                    <button 
                                        type="submit"
                                        className="w-full py-3 bg-[#131b2e] hover:bg-[#1e2d45] text-white font-bold rounded-xl text-sm transition-all shadow-md"
                                    >
                                        {isRegistering ? "Crear Cuenta" : "Iniciar Sesión"}

                                    >

                                    </button>
                                </div>
                            </div>
                        </div>
                    );

                return (

                        {/* HUD de Alerta Toast */}

                        {/* Modal de Confirmación */}

                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ── SIDEBAR PC – Zenith Order ───────────────────── */}

                                    <div className="w-10 h-10 rounded-xl bg-[#131b2e] flex items-center justify-center shrink-0">
                                        <span className="material-symbols-outlined mat-fill text-[#6cf8bb] text-[22px]">account_balance_wallet</span>
                                    </div>

                                    </div>
                                </div>
                                {!hasValidApiKey && (
                                    <span className="text-[9px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold mt-2 inline-block border border-amber-200 uppercase tracking-wider">Modo Local</span>
                                )}
                            </div>
                            <nav className="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
                                {[

                            <div className="px-3 pb-5 pt-2 border-t border-[#c6c6cd]">

                                    Cerrar Sesión
                                </button>
                            </div>

                        {/* ── HEADER MÓVIL – Zenith Order ─────────────────── */}
                        <header className="md:hidden bg-white border-b border-[#c6c6cd] px-4 py-3 sticky top-0 z-40 flex justify-between items-center shadow-sm">
                            <div className="flex items-center gap-3">
                                <div className="w-11 h-11 rounded-xl bg-[#131b2e] flex items-center justify-center shrink-0">
                                    <span className="material-symbols-outlined mat-fill text-[#6cf8bb] text-[22px]">account_balance_wallet</span>
                                </div>
                                <div>
                                    <h1 className="text-xl font-extrabold text-[#0b1c30] tracking-tight leading-tight">Zenith Order</h1>
                                    <p className="text-[10px] text-[#45464d] truncate max-w-[160px]">{user?.email}</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                {loading && <span className="text-[10px] text-[#006c49] font-semibold animate-pulse">Sync...</span>}
                                <button onClick={handleLogout}

                        {/* Contenedor Central Principal */}
                        <main className="p-4 md:p-8 max-w-6xl mx-auto space-y-6">

                                        {{

                                            history: 'Historial de Transacciones',

                                            config: 'Configuración',
                                        }[activeTab] || ''}
                                    </p>
                                    <p className="text-sm font-semibold text-[#45464d]">
                                        {filterMode === 'single' && `${MONTH_NAMES[selectedMonth]} ${selectedYear}`}
                                        {filterMode === 'range' && `${MONTH_NAMES[rangeStart]} – ${MONTH_NAMES[rangeEnd]} ${selectedYear}`}
                                        {filterMode === 'year' && `Año ${selectedYear}`}
                                    </p>
                                </div>
                                <button onClick={() => setShowFilter(p => !p)}
                                    className={`flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-semibold border transition-all ${showFilter ? 'bg-[#006c49] text-white border-[#006c49]' : 'bg-white text-[#006c49] border-[#006c49] hover:bg-[#f0fdf4]'}`}>
                                    <span className="material-symbols-outlined text-[16px]">calendar_month</span>

                                </button>
                            </div>

                            {/* Panel de filtro desplegable */}
                            {showFilter && (
                                <div className="bg-white rounded-2xl border border-[#e0e4f4] shadow-md p-4 space-y-4 animate-fade-in">
                                    <div className="flex p-1 bg-[#f0f3ff] rounded-xl text-sm font-bold">
                                        <button onClick={() => setFilterMode('single')} className={`flex-1 py-2 rounded-lg transition-all ${filterMode === 'single' ? 'bg-white text-[#006c49] shadow' : 'text-[#45464d]'}`}>Un Mes</button>
                                        <button onClick={() => setFilterMode('range')}  className={`flex-1 py-2 rounded-lg transition-all ${filterMode === 'range'  ? 'bg-white text-[#006c49] shadow' : 'text-[#45464d]'}`}>Rango</button>
                                        <button onClick={() => setFilterMode('year')}   className={`flex-1 py-2 rounded-lg transition-all ${filterMode === 'year'   ? 'bg-white text-[#006c49] shadow' : 'text-[#45464d]'}`}>Año completo</button>
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                        <div className="flex flex-col">
                                            <span className="text-xs font-bold text-[#76777d] uppercase mb-1.5">Año</span>
                                            <select value={selectedYear} onChange={(e) => setSelectedYear(Number(e.target.value))} className="p-3 border border-[#c6c6cd] rounded-xl text-sm font-bold text-[#0b1c30] bg-[#f8f9ff] outline-none focus:ring-2 focus:ring-[#006c49]">
                                                {[2024,2025,2026,2027,2028].map(y => <option key={y} value={y}>{y}</option>)}
                                            </select>
                                        </div>
                                        {filterMode === 'single' && (

                                                <span className="text-xs font-bold text-[#76777d] uppercase mb-1.5">Mes</span>
                                                <select value={selectedMonth} onChange={(e) => { setSelectedMonth(Number(e.target.value)); setShowFilter(false); }} className="p-3 border border-[#c6c6cd] rounded-xl text-sm font-bold text-[#0b1c30] bg-[#f8f9ff] outline-none focus:ring-2 focus:ring-[#006c49]">

                            {/* TAB: DASHBOARD */}

                                                                    <button
                                                                        onClick={() => setEditingCat({ type: catViewType, oldName: cat, newName: cat, isPreset: false })}
                                                                        className="opacity-0 group-hover:opacity-100 p-1.5 text-[#76777d] hover:text-[#006c49] hover:bg-[#f0fdf4] rounded-lg transition-all" title="Renombrar">
                                                                        <AppIcon name="pencil" size={14} />
                                                                    </button>
                                                                    <button
                                                                        onClick={() => triggerDeleteCategory(cat, catViewType)}
                                                                        className="opacity-0 group-hover:opacity-100 p-1.5 text-[#76777d] hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all" title="Eliminar">
                                                                        <AppIcon name="trash-2" size={14} />
                                                                    </button>
                                                                </>
                                                            )}
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>

                                        {/* Footer con totales */}
                                        <div className="px-5 py-3 bg-[#f8f9ff] border-t border-[#e0e4f4] flex justify-between items-center">
                                            <span className="text-xs text-[#45464d] font-medium">
                                                Total {catViewType === 'Gasto' ? 'Gastos' : 'Ingresos'}: <strong className="text-[#0b1c30]">{mergedCategories[catViewType].length} categorías activas</strong>
                                            </span>
                                            <span className="text-[10px] text-[#76777d]">
                                                {presetCategories[catViewType].length} sistema · {customCategories[catViewType].length} personalizadas
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            )} {/* fin configSubTab === 'categories' */}

                            {/* ── Sub-tab: GENERAL (Moneda + preferencias) ── */}
                            {configSubTab === 'general' && (
                                <div className="space-y-5 animate-fade-in">

                                    {/* Selector de moneda */}
                                    <div className="bg-white rounded-2xl border border-[#e0e4f4] shadow-sm overflow-hidden">
                                        <div className="p-5 border-b border-[#e0e4f4] flex items-center gap-3">
                                            <div className="w-10 h-10 rounded-xl bg-[#e6fef4] flex items-center justify-center">
                                                <span className="material-symbols-outlined mat-fill text-[#006c49] text-[22px]">payments</span>
                                            </div>
                                            <div>
                                                <h3 className="text-base font-bold text-[#0b1c30]">Moneda de la Aplicación</h3>
                                                <p className="text-xs text-[#45464d]">Todos los montos se mostrarán en la moneda seleccionada</p>
                                            </div>
                                        </div>
                                        <div className="p-5 space-y-3">
                                            {CURRENCIES.map(cur => (
                                                <button key={cur.code} onClick={() => handleCurrencyChange(cur.code)}
                                                    className={`w-full flex items-center justify-between p-4 rounded-xl border-2 transition-all ${
                                                        selectedCurrency === cur.code
                                                        ? 'border-[#006c49] bg-[#f0fdf4]'
                                                        : 'border-[#e0e4f4] bg-white hover:border-[#c6c6cd] hover:bg-[#f8f9ff]'
                                                    }`}>
                                                    <div className="flex items-center gap-3">
                                                        <span className={`text-2xl font-black w-10 text-center ${selectedCurrency === cur.code ? 'text-[#006c49]' : 'text-[#45464d]'}`}>{cur.symbol}</span>
                                                        <div className="text-left">
                                                            <p className={`text-sm font-bold ${selectedCurrency === cur.code ? 'text-[#006c49]' : 'text-[#0b1c30]'}`}>{cur.label}</p>
                                                            <p className="text-xs text-[#76777d]">Ejemplo: {new Intl.NumberFormat(cur.locale, {style:'currency',currency:cur.code,minimumFractionDigits:0}).format(1500000)}</p>
                                                        </div>
                                                    </div>
                                                    {selectedCurrency === cur.code && (
                                                        <span className="material-symbols-outlined mat-fill text-[#006c49] text-[22px]">check_circle</span>
                                                    )}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Info de la cuenta */}
                                    <div className="bg-white rounded-2xl border border-[#e0e4f4] p-5 space-y-3">
                                        <h3 className="text-base font-bold text-[#0b1c30] flex items-center gap-2">
                                            <span className="material-symbols-outlined text-[#006c49] text-[20px]">account_circle</span>
                                            Cuenta Activa
                                        </h3>
                                        <div className="bg-[#f8f9ff] rounded-xl p-4 space-y-2">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs text-[#45464d] font-semibold uppercase">Correo</span>
                                                <span className="text-sm font-bold text-[#0b1c30]">{user?.email}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs text-[#45464d] font-semibold uppercase">Modo</span>
                                                <span className={`text-xs font-bold px-2 py-1 rounded-full ${hasValidApiKey ? 'bg-[#e6fef4] text-[#006c49]' : 'bg-amber-100 text-amber-700'}`}>
                                                    {hasValidApiKey ? '☁ Firebase' : '💾 Local'}
                                                </span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs text-[#45464d] font-semibold uppercase">Moneda activa</span>
                                                <span className="text-sm font-bold text-[#006c49]">{currencyDef?.symbol} {selectedCurrency}</span>
                                            </div>
                                        </div>
                                        <button onClick={handleLogout}
                                            className="w-full mt-2 py-3 flex items-center justify-center gap-2 text-sm font-semibold text-[#ba1a1a] hover:bg-[#ffdad6] rounded-xl border border-[#ffdad6] transition-all">
                                            <span className="material-symbols-outlined text-[18px]">logout</span>
                                            Cerrar Sesión
                                        </button>
                                    </div>

                                </div>
                            )} {/* fin configSubTab === 'general' */}

                                </div>
                            )} {/* fin activeTab === 'config' */}

                            {/* TAB: CONTROL DE EFECTIVO */}
                            {activeTab === 'cash' && (
                                <div className="space-y-6 animate-fade-in text-[#0b1c30]">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-[#e0e4f4] flex items-start gap-4">
                                        <div className="p-3 bg-[#f0fdf4] text-[#006c49] rounded-xl hidden sm:block"><AppIcon name="sparkles" /></div>
                                        <div>
                                            <h2 className="text-lg font-black text-[#0b1c30]">Monitoreo de Liquidez Proyectada</h2>
                                            <p className="text-xs text-[#45464d] mt-1 leading-relaxed">Controla el dinero en cuentas bancarias o efectivo físico. El sistema calculará y proyectará tus saldos descontando tus egresos presupuestados pendientes del mes ({MONTH_NAMES[selectedMonth]}).</p>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-[#e0e4f4] space-y-2">
                                            <label className="block text-xs font-bold text-[#45464d] uppercase flex items-center gap-1.5"><AppIcon name="landmark" size={13} /> Disponible Bancos</label>
                                            <input type="text" value={cashInputs.juan} onChange={(e) => handleCashFieldInputChange('juan', e.target.value)} placeholder="$ 0" className="w-full p-2.5 border border-[#c6c6cd] rounded-xl bg-[#f8f9ff] text-base font-bold text-[#0b1c30]" />
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-[#e0e4f4] space-y-2">
                                            <label className="block text-xs font-bold text-[#45464d] uppercase flex items-center gap-1.5"><AppIcon name="banknote" size={13} /> Disponible Efectivo</label>
                                            <input type="text" value={cashInputs.sindy} onChange={(e) => handleCashFieldInputChange('sindy', e.target.value)} placeholder="$ 0" className="w-full p-2.5 border border-[#c6c6cd] rounded-xl bg-[#f8f9ff] text-base font-bold text-[#0b1c30]" />
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-[#e0e4f4] space-y-2">
                                            <label className="block text-xs font-bold text-[#45464d] uppercase">Otros Disponibles</label>
                                            <input type="text" value={cashInputs.otros} onChange={(e) => handleCashFieldInputChange('otros', e.target.value)} placeholder="$ 0" className="w-full p-2.5 border border-[#c6c6cd] rounded-xl bg-[#f8f9ff] text-base font-bold text-[#0b1c30]" />
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-rose-100 bg-rose-50/10 space-y-2">
                                            <label className="block text-xs font-bold text-rose-600 uppercase flex items-center gap-1.5"><AppIcon name="credit-card" size={14} /> Deuda Tarjetas</label>
                                            <input type="text" value={cashInputs.tarjetaCredito} onChange={(e) => handleCashFieldInputChange('tarjetaCredito', e.target.value)} placeholder="$ 0" className="w-full p-2.5 border border-rose-200 rounded-xl bg-rose-50/50 text-base font-bold text-rose-800" />
                                        </div>
                                    </div>

                                    <div className="bg-[#131b2e] rounded-2xl p-6 text-white grid grid-cols-1 md:grid-cols-4 gap-6 shadow-xl">
                                        <div>
                                            <p className="text-xs text-[#76777d] uppercase font-extrabold tracking-wider">A. Total Efectivo</p>
                                            <p className="text-xl font-black text-slate-100">{formatCOP(stats.totalEfectivoCaja)}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-[#76777d] uppercase font-extrabold text-amber-400 tracking-wider">B. Gastos Proyectados</p>
                                            <p className="text-xl font-black text-amber-400">-{formatCOP(stats.totalGastosPendientesReservar)}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-[#76777d] uppercase font-extrabold text-rose-400 tracking-wider">C. Deudas Ingresadas</p>
                                            <p className="text-xl font-black text-rose-400">-{formatCOP(cashFlowData.tarjetaCredito)}</p>
                                        </div>
                                        <div className="bg-[#1e2d45] p-3 rounded-xl">
                                            <p className="text-xs text-[#4edea3] uppercase font-extrabold tracking-wider">Disponible Real (A-B-C)</p>
                                            <p className={`text-2xl font-black ${stats.disponibleReal >= 0 ? 'text-[#4edea3]' : 'text-rose-400'}`}>{formatCOP(stats.disponibleReal)}</p>
                                        </div>
                                    </div>

                                    {/* Exclusión de Gastos */}
                                    <div className="bg-white rounded-2xl shadow-sm border border-[#e0e4f4] p-6 text-[#0b1c30]">
                                        <h3 className="text-base font-bold text-[#0b1c30] mb-2 flex items-center gap-1.5"><AppIcon name="check-square" /> Exclusión de Gastos Mensuales</h3>
                                        <p className="text-xs text-[#76777d] mb-4 font-medium">Marca los gastos presupuestados que **no pagarás este mes**. Se excluirán del cálculo de liquidez.</p>
                                        <div className="divide-y divide-slate-100 max-h-96 overflow-y-auto pr-2">
                                            {stats.breakdown.filter(item => item.type === 'Gasto').map((item, idx) => (
                                                <div key={idx} className={`py-3 flex justify-between items-center transition-colors ${item.excluido ? 'opacity-50' : ''}`}>
                                                    <div className="flex items-center gap-3">
                                                        <button onClick={() => toggleCategoryExclusion(item.category)} className="text-[#76777d] hover:text-[#006c49]">
                                                            {item.excluido ? <AppIcon name="square" className="text-rose-400" /> : <AppIcon name="check-square" className="text-[#006c49]" />}
                                                        </button>
                                                        <span className="text-sm font-bold text-[#0b1c30]">{item.category}</span>
                                                    </div>
                                                    <span className="text-xs font-bold text-[#45464d]">Pendiente: {formatCOP(item.pendiente)}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )} {/* fin activeTab === 'cash' */}

                        </main>

                        {/* Barra de Navegación Inferior (Móvil) */}
                        <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-[#e0e4f4] flex justify-around items-center px-2 pt-2 pb-4 shadow-[0_-8px_20px_-4px_rgba(0,0,0,0.08)] z-40">
                            <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center gap-1 px-3 py-2 rounded-2xl transition-all ${activeTab === 'dashboard' ? 'text-[#006c49] bg-[#f0fdf4]' : 'text-[#76777d]'}`}>
                                <AppIcon name="pie-chart" size={22} /><span className="text-[10px] font-black">Resumen</span>
                            </button>
                            <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center gap-1 px-3 py-2 rounded-2xl transition-all ${activeTab === 'history' ? 'text-[#006c49] bg-[#f0fdf4]' : 'text-[#76777d]'}`}>
                                <AppIcon name="list" size={22} /><span className="text-[10px] font-black">Historial</span>
                            </button>
                            <button onClick={() => { resetWizard(); setActiveTab('add'); }}
                                className={`flex flex-col items-center justify-center gap-1 px-5 py-3 rounded-2xl shadow-lg -mt-5 ring-4 ring-white transition-all active:scale-95 ${activeTab === 'add' ? 'bg-[#005236]' : 'bg-[#006c49]'}`}>
                                <AppIcon name="plus" size={26} className="text-white" /><span className="text-[10px] font-black text-white">Nuevo</span>
                            </button>
                            <button onClick={() => setActiveTab('cash')} className={`flex flex-col items-center gap-1 px-3 py-2 rounded-2xl transition-all ${activeTab === 'cash' ? 'text-[#006c49] bg-[#f0fdf4]' : 'text-[#76777d]'}`}>
                                <AppIcon name="wallet" size={22} /><span className="text-[10px] font-black">Efectivo</span>
                            </button>
                            <button onClick={() => setActiveTab('config')} className={`flex flex-col items-center gap-1 px-3 py-2 rounded-2xl transition-all ${activeTab === 'config' ? 'text-[#006c49] bg-[#f0fdf4]' : 'text-[#76777d]'}`}>
                                <AppIcon name="settings" size={22} /><span className="text-[10px] font-black">Config.</span>
                            </button>
                        </nav>

                    </div>
                );
            }

            // Renderizar la aplicación de React en el nodo root
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<MainApp />);
        }
    </script>
</body>
</html>
