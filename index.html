                return new Intl.NumberFormat('es-CO', {

            function svgArcPath(cx, cy, R, ri, startDeg, endDeg) {
                if (endDeg - startDeg >= 360) endDeg = startDeg + 359.99;
                var toR = function(d) { return (d - 90) * Math.PI / 180; };
                var px  = function(d, r) { return +(cx + r * Math.cos(toR(d))).toFixed(2); };
                var py  = function(d, r) { return +(cy + r * Math.sin(toR(d))).toFixed(2); };
                var lg  = (endDeg - startDeg > 180) ? 1 : 0;
                return 'M' + px(startDeg,R) + ' ' + py(startDeg,R)
                     + ' A' + R + ' ' + R + ' 0 ' + lg + ' 1 ' + px(endDeg,R) + ' ' + py(endDeg,R)
                     + ' L' + px(endDeg,ri) + ' ' + py(endDeg,ri)
                     + ' A' + ri + ' ' + ri + ' 0 ' + lg + ' 0 ' + px(startDeg,ri) + ' ' + py(startDeg,ri) + ' Z';
            }

            function buildPie(items) {
                var total = items.reduce(function(s, i) { return s + i.amt; }, 0);
                if (!total) return [];
                var cursor = 0;
                return items.map(function(item) {
                    var angle = (item.amt / total) * 360;
                    var seg = { cat: item.cat, amt: item.amt, pct: ((item.amt/total)*100).toFixed(1),
                                startDeg: cursor, endDeg: cursor + angle };
                    cursor += angle;
                    return seg;
                });
            }

                            showToast("Dominio no autorizado en Firebase Console → Authentication → Authorized domains.", "error");

                // ── WIZARD: funciones auxiliares ──────────────────────────────
                const resetWizard = () => {

                const wizardAmountValue = () => {

                };

                const formatWizardAmount = (str) => {

                };

                const handleWizardCreateCategory = async () => {
                    const name = wizardNewCatName.trim();
                    if (!name) { showToast("Escribe el nombre de la categoría.", "error"); return; }
                    if (mergedCategories[wizardData.type].includes(name)) { showToast("Ya existe esa categoría.", "error"); return; }
                    if (hasValidApiKey && db) {

                const handleWizardSubmit = async () => {

                    if (hasValidApiKey && db) {

                // ── COMPLETAR ONBOARDING ──────────────────────────────────────
                const handleCompleteOnboarding = async () => {
                    const allCats = [
                        ...onbIncome.map(n => ({n, type:'Ingreso'})),
                        ...onbExpense.map(n => ({n, type:'Gasto'}))
                    ];
                    for (const {n: cat, type} of allCats) {
                        if (mergedCategories[type].includes(cat)) continue;
                        const catId = type + '_' + cat.replace(/\s+/g,'_');
                        if (hasValidApiKey && db) {
                            await setDoc(doc(db,'artifacts',appId,'users',user.uid,'customCategories',catId),
                                {name:cat, type, createdAt:new Date().toISOString()});
                        } else {
                            const up = 'finanzas_' + user.uid + '_';
                            const raw = localStorage.getItem(up+'customCategories');
                            const p = raw ? JSON.parse(raw) : {Ingreso:[],Gasto:[]};

                            window.dispatchEvent(new Event('localDataChanged'));

                    }
                    for (const cat of [...onbIncome, ...onbExpense]) {

                        if (amt <= 0) continue;
                        if (onbBudgetMode === 'year') {
                            for (let m = 0; m < 12; m++) await handleBudgetChange(cat, m, amt.toString());
                        } else {
                            await handleBudgetChange(cat, selectedMonth, amt.toString());

                    }
                    localStorage.setItem('zo_onb_' + user.uid, 'done');
                    setShowOnboarding(false);
                    showToast('¡Listo! Tu configuración inicial está guardada.');

                // ── DATOS PARA INFORMES (pre-calculados, Babel-safe) ──────────
                const reportData = React.useMemo(() => {
                    const monthly = MONTH_NAMES.map((nm, m) => {
                        let inc = 0, exp = 0;
                        transactions.forEach(t => {
                            const p = getDateParts(t.date);
                            if (p.year !== selectedYear || p.month !== m) return;
                            if (t.type === 'Ingreso') inc += t.amount;
                            else exp += t.amount;
                        });
                        return {name: nm.slice(0,3), fullName: nm, month: m, income: inc, expense: exp, net: inc - exp};
                    });
                    const catInc = {}, catExp = {};
                    transactions.forEach(t => {
                        if (getDateParts(t.date).year !== selectedYear) return;
                        if (t.type === 'Ingreso') catInc[t.category] = (catInc[t.category]||0) + t.amount;
                        else catExp[t.category] = (catExp[t.category]||0) + t.amount;
                    });
                    const topInc = Object.keys(catInc).map(k => ({cat:k, amt:catInc[k]})).sort((a,b) => b.amt-a.amt).slice(0,8);
                    const topExp = Object.keys(catExp).map(k => ({cat:k, amt:catExp[k]})).sort((a,b) => b.amt-a.amt).slice(0,8);
                    const totalInc = topInc.reduce((s,i) => s+i.amt, 0);
                    const totalExp = topExp.reduce((s,i) => s+i.amt, 0);
                    const maxInc = topInc.length ? topInc[0].amt : 1;
                    const maxExp = topExp.length ? topExp[0].amt : 1;
                    const maxMonth = Math.max(1, ...monthly.map(m => Math.max(m.income, m.expense)));
                    const savingRate = totalInc > 0 ? ((totalInc-totalExp)/totalInc*100).toFixed(1) : '0.0';
                    const expRate = totalInc > 0 ? (totalExp/totalInc*100).toFixed(1) : '0.0';
                    return {monthly, topInc, topExp, totalInc, totalExp, maxInc, maxExp, maxMonth, savingRate, expRate};
                }, [transactions, selectedYear]);

                // ── FILTRADO DE INFORMES ──────────────────────────────────────
                const reportFiltered = React.useMemo(() => {
                    return transactions.filter(t => {
                        const p = getDateParts(t.date);
                        if (p.year !== reportYear) return false;
                        if (reportPeriod === 'month' && p.month !== reportMonth) return false;
                        if (reportPeriod === 'range' && (p.month < reportRangeStart || p.month > reportRangeEnd)) return false;
                        if (reportCategories.length > 0 && !reportCategories.includes(t.category)) return false;
                        return true;
                    });
                }, [transactions, reportYear, reportPeriod, reportMonth, reportRangeStart, reportRangeEnd, reportCategories]);

                const reportStats = React.useMemo(() => {
                    const catInc = {}, catExp = {};
                    let totalInc = 0, totalExp = 0;
                    reportFiltered.forEach(t => {
                        if (t.type === 'Ingreso') { catInc[t.category] = (catInc[t.category]||0) + t.amount; totalInc += t.amount; }
                        else { catExp[t.category] = (catExp[t.category]||0) + t.amount; totalExp += t.amount; }
                    });
                    const topInc = Object.keys(catInc).map(k => ({cat:k, amt:catInc[k]})).sort((a,b) => b.amt-a.amt).slice(0,8);
                    const topExp = Object.keys(catExp).map(k => ({cat:k, amt:catExp[k]})).sort((a,b) => b.amt-a.amt).slice(0,8);
                    const maxBar = Math.max(1, ...topInc.map(i=>i.amt), ...topExp.map(i=>i.amt));
                    const pieInc = buildPie(topInc);
                    const pieExp = buildPie(topExp);
                    // Monthly trend for year view
                    const monthly = MONTH_NAMES.map((nm, m) => {
                        let inc = 0, exp = 0;
                        transactions.filter(t => { const p=getDateParts(t.date); return p.year===reportYear && p.month===m && (reportCategories.length===0||reportCategories.includes(t.category)); })
                            .forEach(t => { if(t.type==='Ingreso') inc+=t.amount; else exp+=t.amount; });
                        return {name:nm.slice(0,3), fullName:nm, month:m, income:inc, expense:exp, net:inc-exp};
                    });
                    const maxMonth = Math.max(1, ...monthly.map(m=>Math.max(m.income,m.expense)));
                    // Budget vs real for filtered period
                    const budVsReal = [];
                    const activeMths = reportPeriod==='year' ? Array.from({length:12},(_,i)=>i) : reportPeriod==='month' ? [reportMonth] : Array.from({length:reportRangeEnd-reportRangeStart+1},(_,i)=>i+reportRangeStart);
                    const allCats = [...new Set([...Object.keys(catInc),...Object.keys(catExp)])];
                    allCats.forEach(cat => {
                        const budg = activeMths.reduce((s,m) => s+(Number(budgets[cat]?.[m])||0), 0);
                        const real = (catInc[cat]||0) + (catExp[cat]||0);
                        const type = catInc[cat] ? 'Ingreso' : 'Gasto';
                        const pct = budg > 0 ? Math.min(200, Math.round((real/budg)*100)) : 0;
                        budVsReal.push({cat, budg, real, type, pct});
                    });
                    budVsReal.sort((a,b) => b.real-a.real);
                    const savingRate = totalInc > 0 ? ((totalInc-totalExp)/totalInc*100).toFixed(1) : '0.0';
                    const expRate   = totalInc > 0 ? (totalExp/totalInc*100).toFixed(1) : '0.0';
                    return {topInc, topExp, totalInc, totalExp, maxBar, pieInc, pieExp, monthly, maxMonth, budVsReal, savingRate, expRate};
                }, [reportFiltered, reportYear, reportPeriod, reportMonth, reportRangeStart, reportRangeEnd, reportCategories, budgets, transactions]);

                // Reset bar animation when report filters change
                React.useEffect(() => {
                    setBarsReady(false);
                    const t = setTimeout(() => setBarsReady(true), 80);
                    return () => clearTimeout(t);
                }, [reportStats, activeReport]);

                // All unique categories across transactions (for filter picker)
                const allReportCats = React.useMemo(() => {
                    const s = new Set();
                    transactions.forEach(t => s.add(t.category));
                    return Array.from(s).sort();

                const handleBudgetChange = async (catName, monthIndex, value) => {
                    if (!user) return;
                    const numericValue = parseFloat(value) || 0;
                    
                    if (hasValidApiKey && db) {
                        const currentCatBudget = budgets[catName] || {};
                        const updatedMonths = { ...currentCatBudget, [monthIndex]: numericValue };
                        try {
                            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'budgets', catName), {
                                months: updatedMonths,
                                updatedAt: new Date().toISOString()
                            }, { merge: true });
                        } catch (error) {
                            console.error(error);
                        }
                    } else {
                        const userPrefix = `finanzas_${user.uid}_`;
                        const current = localStorage.getItem(`${userPrefix}budgets`);
                        const parsed = current ? JSON.parse(current) : {};
                        if (!parsed[catName]) parsed[catName] = {};
                        parsed[catName][monthIndex] = numericValue;
                        localStorage.setItem(`${userPrefix}budgets`, JSON.stringify(parsed));
                        
                        window.dispatchEvent(new Event('localDataChanged'));
                    }
                };

                const handleBulkBudgetApply = async () => {
                    if (!user || !selectedBudgetCategory || !bulkBudgetValueText) {
                        showToast("Selecciona un concepto e ingresa el monto.", "error");
                        return;
                    }

                    const value = cleanCurrencyToNumber(bulkBudgetValueText);
                    const updatedMonths = { ...(budgets[selectedBudgetCategory] || {}) };

                    if (targetBudgetMonth === 'all') {
                        for (let i = 0; i < 12; i++) {
                            updatedMonths[i] = value;
                        }
                    } else {
                        updatedMonths[Number(targetBudgetMonth)] = value;
                    }

                    if (hasValidApiKey && db) {
                        try {
                            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'budgets', selectedBudgetCategory), {
                                months: updatedMonths,
                                updatedAt: new Date().toISOString()
                            }, { merge: true });
                            
                            setBulkBudgetValueText('');
                            showToast(targetBudgetMonth === 'all'
                                ? `Presupuesto asignado a todo el año en: ${selectedBudgetCategory}`
                                : `Presupuesto guardado en ${MONTH_NAMES[Number(targetBudgetMonth)]} para: ${selectedBudgetCategory}`
                            );
                        } catch (error) {
                            console.error(error);
                            showToast("Error de conexión al guardar el presupuesto", "error");
                        }
                    } else {
                        const userPrefix = `finanzas_${user.uid}_`;
                        const current = localStorage.getItem(`${userPrefix}budgets`);
                        const parsed = current ? JSON.parse(current) : {};
                        parsed[selectedBudgetCategory] = updatedMonths;
                        localStorage.setItem(`${userPrefix}budgets`, JSON.stringify(parsed));
                        
                        setBulkBudgetValueText('');
                        showToast(`Presupuesto guardado localmente.`);
                        window.dispatchEvent(new Event('localDataChanged'));
                    }
                };

                // ── CORRECCIÓN: evitar stale closure en cashFlowData ──────────
                // Antes: saveCashFieldToDb leía cashFlowData del closure (valor viejo),
                // causando que al editar varios campos en rápida sucesión el segundo campo
                // sobreescribiera el valor del primero con cero.
                // Solución: usar setState funcional para siempre tener el valor más reciente,
                // y pasar los datos frescos directamente a la función de guardado.
                const handleCashFieldInputChange = (field, textValue) => {
                    const formatted = formatInputOnTheFly(textValue);
                    const numValue = cleanCurrencyToNumber(textValue);
                    setCashInputs(prev => ({ ...prev, [field]: formatted }));
                    // Usamos el updater funcional para obtener el estado más reciente
                    // y pasamos el objeto completo a la función de guardado
                    setCashFlowData(prev => {
                        const updatedData = { ...prev, [field]: numValue };
                        saveCashDataToDb(updatedData); // datos frescos, sin closure stale
                        return updatedData;
                    });
                };

                const saveCashDataToDb = async (updatedData) => {
                    if (!user) return;
                    if (hasValidApiKey && db) {
                        try {
                            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cashFlows', monthlyKey), updatedData, { merge: true });
                        } catch (err) {
                            console.error("Error guardando cambios de efectivo:", err);
                            showToast("Error al guardar datos de efectivo", "error");
                        }
                    } else {
                        const userPrefix = `finanzas_${user.uid}_`;
                        localStorage.setItem(`${userPrefix}cashFlows_${monthlyKey}`, JSON.stringify(updatedData));
                        // No dispatching localDataChanged aquí porque ya actualizamos
                        // el estado directamente con setCashFlowData — evita doble render
                    }
                };

                const toggleCategoryExclusion = async (category) => {
                    if (!user) return;
                    let newExcluidos = [...cashFlowData.excluidos];
                    if (newExcluidos.includes(category)) {
                        newExcluidos = newExcluidos.filter(c => c !== category);
                    } else {
                        newExcluidos.push(category);
                    }

                    const updatedData = { ...cashFlowData, excluidos: newExcluidos };
                    setCashFlowData(updatedData);

                    if (hasValidApiKey && db) {
                        try {
                            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cashFlows', monthlyKey), updatedData, { merge: true });
                        } catch (err) {
                            console.error("Error guardando exclusión:", err);
                        }
                    } else {
                        const userPrefix = `finanzas_${user.uid}_`;
                        localStorage.setItem(`${userPrefix}cashFlows_${monthlyKey}`, JSON.stringify(updatedData));
                        window.dispatchEvent(new Event('localDataChanged'));
                    }
                };

                // --- PROCESAMIENTO ANALÍTICO ---
                const stats = useMemo(() => {
                    const activeMonths = [];
                    if (filterMode === 'single') {
                        activeMonths.push(selectedMonth);
                    } else if (filterMode === 'range') {
                        const start = Math.min(rangeStart, rangeEnd);
                        const end = Math.max(rangeStart, rangeEnd);
                        for (let m = start; m <= end; m++) {
                            activeMonths.push(m);
                        }
                    } else {
                        for (let m = 0; m < 12; m++) activeMonths.push(m);
                    }

                    const filteredTrans = transactions.filter(t => {
                        const { year, month } = getDateParts(t.date);
                        return year === selectedYear && activeMonths.includes(month);
                    });

                    let totalIngresosReal = 0;
                    let totalGastosReal = 0;
                    const realPorCategoria = {};

                    filteredTrans.forEach(t => {
                        if (t.type === 'Ingreso') {
                            totalIngresosReal += t.amount;
                        } else {
                            totalGastosReal += t.amount;
                        }
                        realPorCategoria[t.category] = (realPorCategoria[t.category] || 0) + t.amount;
                    });

                    let totalIngresosPresupuesto = 0;
                    let totalGastosPresupuesto = 0;

                    mergedCategories.Ingreso.forEach(cat => {
                        let catBudgetSum = 0;
                        activeMonths.forEach(m => {
                            catBudgetSum += budgets[cat]?.[m] || 0;
                        });
                        totalIngresosPresupuesto += catBudgetSum;
                    });

                    mergedCategories.Gasto.forEach(cat => {
                        let catBudgetSum = 0;
                        activeMonths.forEach(m => {
                            catBudgetSum += budgets[cat]?.[m] || 0;
                        });
                        totalGastosPresupuesto += catBudgetSum;
                    });

                    const breakdown = [];
                    let totalGastosPendientesReservar = 0;

                    // Para el cálculo de liquidez (efectivo) SIEMPRE usamos solo el mes seleccionado,
                    // sin importar el filtro global. Así el efectivo disponible es siempre del mes actual.
                    const cashMonth = selectedMonth;
                    const cashMonthTrans = transactions.filter(t => {
                        const { year, month } = getDateParts(t.date);
                        return month === cashMonth && year === selectedYear;
                    });

                    mergedCategories.Gasto.forEach(cat => {
                        const real = realPorCategoria[cat] || 0;
                        let presupuestado = 0;
                        activeMonths.forEach(m => {
                            presupuestado += budgets[cat]?.[m] || 0;
                        });

                        // Para el efectivo: solo el mes del filtro
                        const realMes = cashMonthTrans.filter(t => t.type === 'Gasto' && t.category === cat).reduce((s, t) => s + t.amount, 0);
                        const presupuestadoMes = Number(budgets[cat]?.[cashMonth] || 0);
                        const pendienteMes = Math.max(0, presupuestadoMes - realMes);
                        const excluido = cashFlowData.excluidos.includes(cat);

                        if (!excluido) {
                            totalGastosPendientesReservar += pendienteMes;
                        }

                        const diferencia = presupuestado - real;
                        const ejecucion = presupuestado > 0 ? (real / presupuestado) * 100 : 0;

                        if (real > 0 || presupuestado > 0) {
                            breakdown.push({
                                category: cat,
                                type: 'Gasto',
                                real,
                                presupuestado,
                                pendiente: pendienteMes,
                                excluido,
                                diferencia,
                                ejecucion
                            });
                        }
                    });

                    mergedCategories.Ingreso.forEach(cat => {
                        const real = realPorCategoria[cat] || 0;
                        let presupuestado = 0;
                        activeMonths.forEach(m => {
                            presupuestado += budgets[cat]?.[m] || 0;
                        });

                        const diferencia = real - presupuestado;
                        const ejecucion = presupuestado > 0 ? (real / presupuestado) * 100 : 0;

                        if (real > 0 || presupuestado > 0) {
                            breakdown.push({
                                category: cat,
                                type: 'Ingreso',
                                real,
                                presupuestado,
                                pendiente: 0,
                                excluido: false,
                                diferencia,
                                ejecucion
                            });
                        }
                    });

                    const topIngresos = breakdown
                        .filter(item => item.type === 'Ingreso' && item.real > 0)
                        .sort((a, b) => b.real - a.real)
                        .slice(0, 5);

                    const topGastos = breakdown
                        .filter(item => item.type === 'Gasto' && item.real > 0)
                        .sort((a, b) => b.real - a.real)
                        .slice(0, 5);

                    const saldoReal = totalIngresosReal - totalGastosReal;
                    const saldoPresupuesto = totalIngresosPresupuesto - totalGastosPresupuesto;

                    const totalEfectivoCaja = cashFlowData.juan + cashFlowData.sindy + cashFlowData.otros;
                    const disponibleReal = totalEfectivoCaja - totalGastosPendientesReservar - cashFlowData.tarjetaCredito;

                    return {
                        totalIngresosReal,
                        totalGastosReal,
                        totalIngresosPresupuesto,
                        totalGastosPresupuesto,
                        saldoReal,
                        saldoPresupuesto,
                        breakdown,
                        filteredTrans,
                        totalGastosPendientesReservar,
                        totalEfectivoCaja,
                        disponibleReal,
                        topIngresos,
                        topGastos,
                        activeMonths
                    };
                }, [transactions, customCategories, budgets, selectedMonth, rangeStart, rangeEnd, filterMode, selectedYear, mergedCategories, cashFlowData]);

                                            <button onClick={() => { setShowForgotModal(false); setForgotSent(false); }}

                                                    </div>
                                                    {selectedCurrency === cur.code && (
                                                        <span className="material-symbols-outlined mat-fill text-[#006c49] text-[22px]">check_circle</span>
                                                    )}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Info de la cuenta */}
                                    <div className="bg-white rounded-2xl border border-[#e0e4f4] p-5 space-y-4">
                                        <h3 className="text-base font-bold text-[#0b1c30] flex items-center gap-2">
                                            <span className="material-symbols-outlined text-[#006c49] text-[20px]">account_circle</span>
                                            Mi Cuenta
                                        </h3>
                                        <div className="bg-[#f8f9ff] rounded-xl p-4 space-y-2">
                                            {user?.displayName && (
                                                <div className="flex justify-between items-center">
                                                    <span className="text-xs text-[#45464d] font-semibold uppercase">Nombre</span>
                                                    <span className="text-sm font-bold text-[#0b1c30]">{user.displayName}</span>
                                                </div>
                                            )}
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs text-[#45464d] font-semibold uppercase">Correo</span>
                                                <span className="text-sm font-bold text-[#0b1c30] truncate max-w-[180px]">{user?.email}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs text-[#45464d] font-semibold uppercase">Modo</span>
                                                <span className={`text-xs font-bold px-2 py-1 rounded-full ${hasValidApiKey ? 'bg-[#e6fef4] text-[#006c49]' : 'bg-amber-100 text-amber-700'}`}>
                                                    {hasValidApiKey ? '☁ Firebase' : EM.E44+' Local'}
                                                </span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs text-[#45464d] font-semibold uppercase">Moneda</span>
                                                <span className="text-sm font-bold text-[#006c49]">{currencyDef?.symbol} {selectedCurrency}</span>
                                            </div>
                                        </div>

                                        {/* Cambiar contraseña */}
                                        <button onClick={() => setShowPwForm(p => !p)}
                                            className="w-full py-3 flex items-center justify-center gap-2 text-sm font-semibold text-[#0b1c30] hover:bg-[#e5eeff] rounded-xl border border-[#c6c6cd] transition-all">
                                            <span className="material-symbols-outlined text-[18px]">key</span>
                                            {showPwForm ? 'Cancelar cambio de contraseña' : 'Cambiar contraseña'}
                                        </button>

                                        {showPwForm && (
                                            <div className="space-y-3 pt-1 animate-fade-in">
                                                <div>
                                                    <label className="text-xs font-bold text-[#45464d] uppercase tracking-wider mb-1.5 block">Contraseña actual</label>
                                                    <input type="password" value={pwCurrent} onChange={e => setPwCurrent(e.target.value)}
                                                        placeholder="••••••••"
                                                        className="w-full p-3 border-2 border-[#c6c6cd] rounded-xl text-sm font-medium outline-none focus:border-[#006c49] bg-white text-[#0b1c30]" />
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-[#45464d] uppercase tracking-wider mb-1.5 block">Nueva contraseña</label>
                                                    <input type="password" value={pwNew} onChange={e => setPwNew(e.target.value)}
                                                        placeholder="Mínimo 6 caracteres"
                                                        className="w-full p-3 border-2 border-[#c6c6cd] rounded-xl text-sm font-medium outline-none focus:border-[#006c49] bg-white text-[#0b1c30]" />
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-[#45464d] uppercase tracking-wider mb-1.5 block">Confirmar nueva contraseña</label>
                                                    <input type="password" value={pwConfirm2} onChange={e => setPwConfirm2(e.target.value)}
                                                        placeholder="Repite la nueva contraseña"
                                                        className="w-full p-3 border-2 border-[#c6c6cd] rounded-xl text-sm font-medium outline-none focus:border-[#006c49] bg-white text-[#0b1c30]" />
                                                </div>
                                                <button onClick={handlePasswordChange}
                                                    className="w-full py-3 bg-[#131b2e] text-white font-bold rounded-xl text-sm hover:bg-[#1e2d45] transition-all">
                                                    Guardar nueva contraseña
                                                </button>
                                            </div>
                                        )}

                                        <button onClick={handleLogout}
                                            className="w-full py-3 flex items-center justify-center gap-2 text-sm font-semibold text-[#ba1a1a] hover:bg-[#ffdad6] rounded-xl border border-[#ffdad6] transition-all">
                                            <span className="material-symbols-outlined text-[18px]">logout</span>
                                            Cerrar Sesión
                                        </button>
                                    </div>

                                </div>
                            )} {/* fin configSubTab === 'general' */}

                                </div>
                            )} {/* fin activeTab === 'config' */}

                            {/* TAB: CONTROL DE EFECTIVO */}
                            {activeTab === 'cash' && (
                                <div className="space-y-6 animate-fade-in text-[#0b1c30]">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-[#e0e4f4] flex items-start gap-4">
                                        <div className="p-3 bg-[#f0fdf4] text-[#006c49] rounded-xl hidden sm:block"><AppIcon name="sparkles" /></div>
                                        <div>
                                            <h2 className="text-lg font-black text-[#0b1c30]">Monitoreo de Liquidez Proyectada</h2>
                                            <p className="text-xs text-[#45464d] mt-1 leading-relaxed">Controla el dinero en cuentas bancarias o efectivo físico. El sistema calculará y proyectará tus saldos descontando tus egresos presupuestados pendientes del mes ({MONTH_NAMES[selectedMonth]}).</p>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-[#e0e4f4] space-y-2">
                                            <label className="block text-xs font-bold text-[#45464d] uppercase flex items-center gap-1.5"><AppIcon name="landmark" size={13} /> Disponible Bancos</label>
                                            <input type="text" value={cashInputs.juan} onChange={(e) => handleCashFieldInputChange('juan', e.target.value)} placeholder="$ 0" className="w-full p-2.5 border border-[#c6c6cd] rounded-xl bg-[#f8f9ff] text-base font-bold text-[#0b1c30]" />
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-[#e0e4f4] space-y-2">
                                            <label className="block text-xs font-bold text-[#45464d] uppercase flex items-center gap-1.5"><AppIcon name="banknote" size={13} /> Disponible Efectivo</label>
                                            <input type="text" value={cashInputs.sindy} onChange={(e) => handleCashFieldInputChange('sindy', e.target.value)} placeholder="$ 0" className="w-full p-2.5 border border-[#c6c6cd] rounded-xl bg-[#f8f9ff] text-base font-bold text-[#0b1c30]" />
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-[#e0e4f4] space-y-2">
                                            <label className="block text-xs font-bold text-[#45464d] uppercase">Otros Disponibles</label>
                                            <input type="text" value={cashInputs.otros} onChange={(e) => handleCashFieldInputChange('otros', e.target.value)} placeholder="$ 0" className="w-full p-2.5 border border-[#c6c6cd] rounded-xl bg-[#f8f9ff] text-base font-bold text-[#0b1c30]" />
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-rose-100 bg-rose-50/10 space-y-2">
                                            <label className="block text-xs font-bold text-rose-600 uppercase flex items-center gap-1.5"><AppIcon name="credit-card" size={14} /> Deuda Tarjetas</label>
                                            <input type="text" value={cashInputs.tarjetaCredito} onChange={(e) => handleCashFieldInputChange('tarjetaCredito', e.target.value)} placeholder="$ 0" className="w-full p-2.5 border border-rose-200 rounded-xl bg-rose-50/50 text-base font-bold text-rose-800" />
                                        </div>
                                    </div>

                                    <div className="bg-[#131b2e] rounded-2xl p-6 text-white grid grid-cols-1 md:grid-cols-4 gap-6 shadow-xl">
                                        <div>
                                            <p className="text-xs text-[#76777d] uppercase font-extrabold tracking-wider">A. Total Efectivo</p>
                                            <p className="text-xl font-black text-slate-100">{formatCOP(stats.totalEfectivoCaja)}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-[#76777d] uppercase font-extrabold text-amber-400 tracking-wider">B. Gastos Proyectados</p>
                                            <p className="text-xl font-black text-amber-400">-{formatCOP(stats.totalGastosPendientesReservar)}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-[#76777d] uppercase font-extrabold text-rose-400 tracking-wider">C. Deudas Ingresadas</p>
                                            <p className="text-xl font-black text-rose-400">-{formatCOP(cashFlowData.tarjetaCredito)}</p>
                                        </div>
                                        <div className="bg-[#1e2d45] p-3 rounded-xl">
                                            <p className="text-xs text-[#4edea3] uppercase font-extrabold tracking-wider">Disponible Real (A-B-C)</p>
                                            <p className={`text-2xl font-black ${stats.disponibleReal >= 0 ? 'text-[#4edea3]' : 'text-rose-400'}`}>{formatCOP(stats.disponibleReal)}</p>
                                        </div>
                                    </div>

                                    {/* Exclusión de Gastos */}
                                    <div className="bg-white rounded-2xl shadow-sm border border-[#e0e4f4] p-6 text-[#0b1c30]">
                                        <h3 className="text-base font-bold text-[#0b1c30] mb-2 flex items-center gap-1.5"><AppIcon name="check-square" /> Exclusión de Gastos Mensuales</h3>
                                        <p className="text-xs text-[#76777d] mb-4 font-medium">Marca los gastos presupuestados que **no pagarás este mes**. Se excluirán del cálculo de liquidez.</p>
                                        <div className="divide-y divide-slate-100 max-h-96 overflow-y-auto pr-2">
                                            {stats.breakdown.filter(item => item.type === 'Gasto').map((item, idx) => (
                                                <div key={idx} className={`py-3 flex justify-between items-center transition-colors ${item.excluido ? 'opacity-50' : ''}`}>
                                                    <div className="flex items-center gap-3">
                                                        <button onClick={() => toggleCategoryExclusion(item.category)} className="text-[#76777d] hover:text-[#006c49]">
                                                            {item.excluido ? <AppIcon name="square" className="text-rose-400" /> : <AppIcon name="check-square" className="text-[#006c49]" />}
                                                        </button>
                                                        <span className="text-sm font-bold text-[#0b1c30]">{item.category}</span>
                                                    </div>
                                                    <span className="text-xs font-bold text-[#45464d]">Pendiente: {formatCOP(item.pendiente)}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )} {/* fin activeTab === 'cash' */}

                        </main>

                        {/* ── BARRA NAVEGACIÓN MÓVIL ── */}
                        <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-[#c6c6cd] z-40 shadow-[0_-4px_12px_rgba(0,0,0,0.07)]">
                            <div className="flex items-end w-full pt-2 pb-4">
                                {/* Grupo izquierdo: 2 tabs */}
                                <div className="flex flex-1 items-end justify-evenly">
                                    <button onClick={() => setActiveTab('dashboard')}
                                        className={`flex flex-col items-center gap-0.5 py-1.5 px-2 rounded-xl transition-all ${activeTab==='dashboard' ? 'text-[#006c49] bg-[#f0fdf4]' : 'text-[#76777d]'}`}>
                                        <span className="material-symbols-outlined text-[22px]">dashboard</span>
                                        <span className="text-[8px] font-bold">Inicio</span>
                                    </button>
                                    <button onClick={() => setActiveTab('history')}
                                        className={`flex flex-col items-center gap-0.5 py-1.5 px-2 rounded-xl transition-all ${activeTab==='history' ? 'text-[#006c49] bg-[#f0fdf4]' : 'text-[#76777d]'}`}>
                                        <span className="material-symbols-outlined text-[22px]">receipt_long</span>
                                        <span className="text-[8px] font-bold">Historial</span>
                                    </button>
                                </div>
                                {/* Botón central Nuevo */}
                                <button onClick={() => { resetWizard(); setActiveTab('add'); }}
                                    className={`flex flex-col items-center justify-center gap-0.5 px-4 py-2.5 rounded-2xl shadow-lg -mt-5 ring-4 ring-white transition-all active:scale-95 shrink-0 ${activeTab==='add' ? 'bg-[#005236]' : 'bg-[#006c49]'}`}>
                                    <span className="material-symbols-outlined text-white text-[24px]">add</span>
                                    <span className="text-[8px] font-bold text-white">Nuevo</span>
                                </button>
                                {/* Grupo derecho: 3 tabs — mismo flex-1 que el izquierdo */}
                                <div className="flex flex-1 items-end justify-evenly">
                                    <button onClick={() => setActiveTab('cash')}
                                        className={`flex flex-col items-center gap-0.5 py-1.5 px-1 rounded-xl transition-all ${activeTab==='cash' ? 'text-[#006c49] bg-[#f0fdf4]' : 'text-[#76777d]'}`}>
                                        <span className="material-symbols-outlined text-[22px]">account_balance</span>
                                        <span className="text-[8px] font-bold">Efectivo</span>
                                    </button>
                                    <button onClick={() => setActiveTab('reports')}
                                        className={`flex flex-col items-center gap-0.5 py-1.5 px-1 rounded-xl transition-all ${activeTab==='reports' ? 'text-[#006c49] bg-[#f0fdf4]' : 'text-[#76777d]'}`}>
                                        <span className="material-symbols-outlined text-[22px]">bar_chart</span>
                                        <span className="text-[8px] font-bold">Informes</span>
                                    </button>
                                    <button onClick={() => setActiveTab('config')}
                                        className={`flex flex-col items-center gap-0.5 py-1.5 px-1 rounded-xl transition-all ${activeTab==='config' ? 'text-[#006c49] bg-[#f0fdf4]' : 'text-[#76777d]'}`}>
                                        <span className="material-symbols-outlined text-[22px]">tune</span>
                                        <span className="text-[8px] font-bold">Config.</span>
                                    </button>
                                </div>
                            </div>
                        </nav>

                    </div>
                );
            }

            // Renderizar la aplicación de React en el nodo root
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<MainApp />);
        }
    </script>
</body>
</html>
